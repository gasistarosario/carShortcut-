

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Autos Cargados</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif;}
    body {background: #d4edf9; padding: 15px; max-width: 900px; margin: 0 auto;}
    h1 {text-align: center; color: #2d3748; margin-bottom: 15px; font-size: 22px;}
    
    .navegacion {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0 20px;
      padding: 12px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .navegacion button {
      padding: 10px 20px;
      font-size: 15px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #4a90e2;
      color: white;
      font-weight: 600;
    }
    .navegacion button:disabled {background: #cbd5e0; cursor: not-allowed;}
    .contador {font-size: 16px; font-weight: bold; color: #2d3748;}

    .tarjeta {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      animation: aparecer 0.3s ease;
    }
    @keyframes aparecer {
      from {opacity: 0; transform: translateX(8px);}
      to {opacity: 1; transform: translateX(0);}
    }
    .etiqueta-tipo {
      display: inline-block;
      background: #ebf8ff;
      color: #2c5282;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .titulo-auto {font-size: 18px; font-weight: 700; color: #2b6cb0; margin-bottom: 12px;}
    .fila {margin-bottom: 8px; color: #2d3748;}
    .fila strong {color: #4a5568; min-width: 110px; display: inline-block;}
    .etiqueta {display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 13px; margin: 4px 8px 4px 0;}
    .permuta {background: #fef5e7; color: #975a16;}
    .contado {background: #e6fffa; color: #047857;}
    .volver {display: inline-block; margin-top: 20px; color: #3182ce; text-decoration: none; font-weight: 600;}
    .volver:hover {text-decoration: underline;}
    .cargando {text-align: center; padding: 40px; color: #4a5568; font-size: 16px;}
    .vacio {text-align: center; padding: 40px 20px; color: #718096; font-size: 16px;}

    .fotos-titulo {margin-top: 18px; font-weight: 700; color: #2b6cb0; font-size: 16px;}
    .fotos-cuadricula {display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 10px;}
    .foto-caja {text-align: center;}
    .foto-ver {width: 100%; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden; background: #f7fafc; border: 1px solid #e2e8f0;}
    .foto-ver img {width: 100%; height: 100%; object-fit: cover;}
    .foto-nombre {font-size: 11px; color: #718096; padding: 4px 0;}
  </style>
</head>
<body>

  <h1>📋 Autos Cargados</h1>

  <div class="navegacion">
    <button id="btnAnterior">◀ Anterior</button>
    <span id="contador" class="contador"></span>
    <button id="btnSiguiente">Siguiente ▶</button>
  </div>

  <div id="listaAutos">
    <div class="cargando">🔄 Cargando...</div>
  </div>

  <a href="index.html" class="volver">← Volver a la página principal</a>

  <script>
    const SUPABASE_URL = "https://cgwdahvstitjksphucqk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gQicOTNud-uR22ur4-TJQw_hAgmkBfr";

    const nombresFotos = [
      'Foto 1', 'Foto 2', 'Foto 3', 'Foto 4', 'Foto 5', 'Foto 6',
      'Foto 7', 'Foto 8', 'Foto 9', 'Foto 10', 'Foto 11', 'Foto 12'
    ];

    let sbClient = null;
    let totalAutos = 0;
    let indiceActual = 0;
    let idsOrdenados = [];

    async function getSupabase() {
      if (!sbClient) {
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return sbClient;
    }

    async function contarYListar() {
      const sb = await getSupabase();
      const { count, data, error } = await sb
        .from('autos')
        .select('id', { count: 'exact', head: false })
        .order('id', { ascending: false });

      if (error || !data || data.length === 0) {
        document.getElementById('listaAutos').innerHTML = 
          `<div class="vacio">📭 Todavía no hay autos cargados</div>`;
        return false;
      }
      totalAutos = count;
      idsOrdenados = data.map(item => item.id);
      return true;
    }

    async function cargarUno(posicion) {
      if (posicion < 0 || posicion >= totalAutos) return;
      
      const caja = document.getElementById('listaAutos');
      caja.innerHTML = `<div class="cargando">🔄 Cargando vehículo ${posicion+1} de ${totalAutos}...</div>`;
      
      const sb = await getSupabase();
      const { data: auto, error } = await sb
        .from('autos')
        .select('*')
        .eq('id', idsOrdenados[posicion])
        .single();

      if (error || !auto) {
        caja.innerHTML = `<div class="vacio">❌ Error al cargar</div>`;
        return;
      }

      let fotosHtml = '';
      for (let i = 1; i <= 12; i++) {
        const foto = auto[`foto${i}`];
        if (foto) {
          fotosHtml += `
            <div class="foto-caja">
              <div class="foto-ver"><img src="${foto}" alt="${nombresFotos[i-1]}"></div>
              <div class="foto-nombre">${nombresFotos[i-1]}</div>
            </div>
          `;
        }
      }
      const hayFotos = fotosHtml !== '';

      caja.innerHTML = `
      <div class="tarjeta">
        ${auto.tipo_vehiculo ? `<span class="etiqueta-tipo">${auto.tipo_vehiculo}</span>` : ''}
        
        <div class="titulo-auto">${auto.marca || ''} ${auto.modelo || ''} — ${auto.anio || ''}</div>
        <div class="fila"><strong>Versión:</strong> ${auto.version || '-'}</div>
        <div class="fila"><strong>Kilometraje:</strong> ${auto.kilometraje ? auto.kilometraje.toLocaleString('es-AR') + ' km' : 'No indicado'}</div>
        <div class="fila"><strong>Precio:</strong> ${auto.precio || '-'}</div>
        <div class="fila"><strong>Dueño:</strong> ${auto.dueno || '-'}</div>
        <div class="fila"><strong>Dirección:</strong> ${auto.direccion || '-'}</div>
        <div class="fila"><strong>Teléfono:</strong> ${auto.telefono || '-'}</div>
        <div>
          ${auto.permuta ? '<span class="etiqueta permuta">✅ Acepta permuta</span>' : ''}
          ${auto.contado ? '<span class="etiqueta contado">💵 Solo contado</span>' : ''}
        </div>
        <div class="fila" style="margin-top: 10px;"><strong>Deuda:</strong> ${auto.deuda || 'Sin deudas'}</div>
        <div class="fila"><strong>Descripción:</strong> ${auto.descripcion || '-'}</div>
        
        ${hayFotos ? `
        <div class="fotos-titulo">📸 Fotos del vehículo</div>
        <div class="fotos-cuadricula">${fotosHtml}</div>
        ` : ''}
      </div>
      `;
      document.getElementById('contador').textContent = `${posicion+1} de ${totalAutos}`;
    }

    async function autoAnterior() {
      if (totalAutos === 0) return;
      if (indiceActual === 0) {
        indiceActual = totalAutos - 1;
      } else {
        indiceActual--;
      }
      await cargarUno(indiceActual);
    }

    async function autoSiguiente() {
      if (totalAutos === 0) return;
      if (indiceActual === totalAutos - 1) {
        indiceActual = 0;
      } else {
        indiceActual++;
      }
      await cargarUno(indiceActual);
    }

    async function iniciar() {
      const hayDatos = await contarYListar();
      if (hayDatos) {
        await cargarUno(0);
      }
    }

    document.getElementById('btnAnterior').addEventListener('click', autoAnterior);
    document.getElementById('btnSiguiente').addEventListener('click', autoSiguiente);

    iniciar();
  </script>

</body>
</html>
