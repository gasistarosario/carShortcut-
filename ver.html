<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Autos Cargados</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #84a6c7; min-height: 100vh; padding: 20px; }
    .contenedor { max-width: 550px; margin: 0 auto; }
    .tarjeta { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    h2 { text-align: center; margin-bottom: 25px; color: #2563eb; }
    .boton-volver { display: inline-block; background: #6b7280; color: white; text-decoration: none; padding: 10px 20px; border-radius: 10px; margin-bottom: 20px; }
    
    /* Tarjeta de cada auto */
    .auto-tarjeta { background: #f9fafb; padding: 18px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid #2563eb; }
    .auto-tarjeta h3 { margin-bottom: 10px; color: #1e40af; }
    .auto-tarjeta p { margin: 6px 0; font-size: 14px; }
    
    /* Fotos */
    .fotos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
    .foto-item { text-align: center; }
    .foto-item small { color: #666; font-size: 11px; }
    .foto-item img { max-width: 100%; border-radius: 8px; margin-top: 4px; }
    
    /* Botones Editar y Eliminar — BIEN VISIBLES */
    .botones-accion { display: flex; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #eee; }
    .btn-editar { flex: 1; background: #f59e0b; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; }
    .btn-editar:hover { background: #d97706; }
    .btn-eliminar { flex: 1; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; }
    .btn-eliminar:hover { background: #dc2626; }
    
    /* Modal / Formulario de Edición */
    .modal-fondo { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; padding: 20px; display: none; z-index: 999; }
    .modal-contenido { background: white; padding: 25px; border-radius: 16px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal-contenido h3 { margin-bottom: 18px; color: #2563eb; text-align: center; }
    .modal-botones { display: flex; gap: 10px; margin-top: 20px; }
    .btn-cancelar { flex: 1; background: #6b7280; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; }
    .btn-guardar { flex: 1; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; }
    
    .seccion { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; }
    input, textarea { width: 100%; padding: 9px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .checkbox-grupo { display: flex; gap: 15px; margin: 8px 0; }
    h4 { margin: 15px 0 8px; color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <div class="contenedor">
    <a href="index.html" class="boton-volver">← Volver al Inicio</a>
    <div class="tarjeta">
      <h2>📋 Lista de Vehículos Cargados</h2>
      <div id="listaAutos"></div>
    </div>
  </div>

<!-- FORMULARIO DE EDICIÓN — SE ABRE AL TOCAR EDITAR -->
<div id="modalEditar" class="modal-fondo">
  <div class="modal-contenido">
    <h3>✏️ Editar Datos del Vehículo</h3>
    <form id="formEditar">
      <input type="hidden" id="edit-id">
      
      <div class="seccion">
        <label>Dueño / Agencia:</label>
        <input type="text" id="edit-dueno_agencia" required>
      </div>
      <div class="seccion">
        <label>Dirección:</label>
        <input type="text" id="edit-direccion">
      </div>
      <div class="seccion">
        <label>Teléfono:</label>
        <input type="text" id="edit-telefono">
      </div>
      
      <div class="seccion">
        <label>Marca:</label>
        <input type="text" id="edit-marca" required>
      </div>
      <div class="seccion">
        <label>Modelo:</label>
        <input type="text" id="edit-modelo" required>
      </div>
      <div class="seccion">
        <label>Versión:</label>
        <input type="text" id="edit-version">
      </div>
      <div class="seccion">
        <label>Año:</label>
        <input type="number" id="edit-anio">
      </div>
      <div class="seccion">
        <label>Precio ($):</label>
        <input type="number" step="0.01" id="edit-precio" required>
      </div>
      
      <div class="checkbox-grupo">
        <label><input type="checkbox" id="edit-permuta"> Permuta</label>
        <label><input type="checkbox" id="edit-contado"> Contado</label>
        <label><input type="checkbox" id="edit-credito"> Crédito</label>
      </div>
      
      <div class="seccion">
        <label>Deuda ($):</label>
        <input type="number" step="0.01" id="edit-deuda">
      </div>
      <div class="seccion">
        <label>Patentes / Multas:</label>
        <textarea id="edit-patentes_multas" rows="2"></textarea>
      </div>
      <div class="seccion">
        <label>Estado del vehículo:</label>
        <textarea id="edit-estado" rows="3"></textarea>
      </div>
      
      <h4>📸 Enlaces de las Fotos</h4>
      <div class="seccion"><label>Frente:</label><input type="text" id="edit-foto_frente_url"></div>
      <div class="seccion"><label>Lateral izquierdo:</label><input type="text" id="edit-foto_lat_izq_url"></div>
      <div class="seccion"><label>Lateral derecho:</label><input type="text" id="edit-foto_lat_der_url"></div>
      <div class="seccion"><label>Trasera:</label><input type="text" id="edit-foto_trasera_url"></div>
      <div class="seccion"><label>Motor:</label><input type="text" id="edit-foto_motor_url"></div>
      <div class="seccion"><label>Interior:</label><input type="text" id="edit-foto_interior_url"></div>
      <div class="seccion"><label>Ruedas:</label><input type="text" id="edit-foto_ruedas_url"></div>
      <div class="seccion"><label>Adicional 1:</label><input type="text" id="edit-foto_extra1_url"></div>
      <div class="seccion"><label>Adicional 2:</label><input type="text" id="edit-foto_extra2_url"></div>
      <div class="seccion"><label>Adicional 3:</label><input type="text" id="edit-foto_extra3_url"></div>
      
      <div class="modal-botones">
        <button type="button" class="btn-cancelar" onclick="cerrarModal()">❌ Cancelar</button>
        <button type="submit" class="btn-guardar">✅ Guardar Cambios</button>
      </div>
    </form>
  </div>
</div>

<script>
// Datos de conexión
const SUPABASE_URL = 'https://cgdahvstitjksphucqk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_gQlcOTNud-ur22ur4-TJQw_hAgmkBfr';

let supabase;
let autosCargados = [];

// Esperar a que cargue la librería
async function esperarSupabase() {
  while (!window.supabase) await new Promise(r => setTimeout(r, 50));
  const { createClient } = window.supabase;
  supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  cargarAutos();
}

// Etiquetas para mostrar las fotos
const fotosEtiquetas = [
  { campo: 'foto_frente_url', nombre: 'Frente' },
  { campo: 'foto_lat_izq_url', nombre: 'Lateral izquierdo' },
  { campo: 'foto_lat_der_url', nombre: 'Lateral derecho' },
  { campo: 'foto_trasera_url', nombre: 'Trasera' },
  { campo: 'foto_motor_url', nombre: 'Motor' },
  { campo: 'foto_interior_url', nombre: 'Interior' },
  { campo: 'foto_ruedas_url', nombre: 'Ruedas' },
  { campo: 'foto_extra1_url', nombre: 'Adicional 1' },
  { campo: 'foto_extra2_url', nombre: 'Adicional 2' },
  { campo: 'foto_extra3_url', nombre: 'Adicional 3' }
];

// Cargar y mostrar la lista de autos
async function cargarAutos() {
  const lista = document.getElementById('listaAutos');
  if (!supabase) return;
  
  lista.innerHTML = '<p style="text-align:center; padding:20px;">Cargando vehículos...</p>';
  
  const { data: autos, error } = await supabase
    .from('autos')
    .select('*')
    .order('id', { ascending: false });
  
  if (error) {
    lista.innerHTML = '<p style="color:red; text-align:center;">❌ Error: ' + error.message + '</p>';
    return;
  }
  
  autosCargados = autos || [];
  
  if (!autos || autos.length === 0) {
    lista.innerHTML = '<p style="text-align:center; color:#666; padding:20px;">No hay autos cargados todavía.<br>Ve a "Ingresar Auto" para agregar el primero.</p>';
    return;
  }
  
  lista.innerHTML = '';
  autos.forEach(auto => {
    let fotosHtml = '';
    fotosEtiquetas.forEach(f => {
      if (auto[f.campo]) {
        fotosHtml += `<div class="foto-item"><small>${f.nombre}</small><img src="${auto[f.campo]}" alt="${f.nombre}"></div>`;
      }
    });
    
    lista.innerHTML += `
      <div class="auto-tarjeta">
        <h3>${auto.marca || ''} ${auto.modelo || ''} ${auto.anio || ''}</h3>
        <p><strong>Dueño/Agencia:</strong> ${auto.dueno_agencia || '-'}</p>
        <p><strong>Dirección:</strong> ${auto.direccion || '-'}</p>
        <p><strong>Teléfono:</strong> ${auto.telefono || '-'}</p>
        <p><strong>Versión:</strong> ${auto.version || '-'}</p>
        <p><strong>Precio:</strong> $${auto.precio || '-'}</p>
        <p><strong>Forma de pago:</strong> ${auto.permuta ? 'Permuta ' : ''}${auto.contado ? 'Contado ' : ''}${auto.credito ? 'Crédito' : '-'}</p>
        <p><strong>Deuda:</strong> ${auto.deuda ? '$'+auto.deuda : '-'}</p>
        <p><strong>Patentes / Multas:</strong> ${auto.patentes_multas || '-'}</p>
        <p><strong>Estado del vehículo:</strong> ${auto.estado || '-'}</p>
        ${fotosHtml ? `<div class="fotos-grid">${fotosHtml}</div>` : ''}
        <div class="botones-accion">
          <button class="btn-editar" onclick="abrirEditar(${auto.id})">✏️ Editar</button>
          <button class="btn-eliminar" onclick="confirmarEliminar(${auto.id})">🗑️ Eliminar</button>
        </div>
      </div>
    `;
  });
}

// Abrir el formulario con los datos cargados
function abrirEditar(id) {
  const auto = autosCargados.find(a => a.id === id);
  if (!auto) return;
  
  document.getElementById('edit-id').value = auto.id;
  document.getElementById('edit-dueno_agencia').value = auto.dueno_agencia || '';
  document.getElementById('edit-direccion').value = auto.direccion || '';
  document.getElementById('edit-telefono').value = auto.telefono || '';
  document.getElementById('edit-marca').value = auto.marca || '';
  document.getElementById('edit-modelo').value = auto.modelo || '';
  document.getElementById('edit-version').value = auto.version || '';
  document.getElementById('edit-anio').value = auto.anio || '';
  document.getElementById('edit-precio').value = auto.precio || '';
  document.getElementById('edit-permuta').checked = auto.permuta || false;
  document.getElementById('edit-contado').checked = auto.contado || false;
  document.getElementById('edit-credito').checked = auto.credito || false;
  document.getElementById('edit-deuda').value = auto.deuda || '';
  document.getElementById('edit-patentes_multas').value = auto.patentes_multas || '';
  document.getElementById('edit-estado').value = auto.estado || '';
  document.getElementById('edit-foto_frente_url').value = auto.foto_frente_url || '';
  document.getElementById('edit-foto_lat_izq_url').value = auto.foto_lat_izq_url || '';
  document.getElementById('edit-foto_lat_der_url').value = auto.foto_lat_der_url || '';
  document.getElementById('edit-foto_trasera_url').value = auto.foto_trasera_url || '';
  document.getElementById('edit-foto_motor_url').value = auto.foto_motor_url || '';
  document.getElementById('edit-foto_interior_url').value = auto.foto_interior_url || '';
  document.getElementById('edit-foto_ruedas_url').value = auto.foto_ruedas_url || '';
  document.getElementById('edit-foto_extra1_url').value = auto.foto_extra1_url || '';
  document.getElementById('edit-foto_extra2_url').value = auto.foto_extra2_url || '';
  document.getElementById('edit-foto_extra3_url').value = auto.foto_extra3_url || '';
  
  document.getElementById('modalEditar').style.display = 'flex';
}

// Cerrar formulario sin guardar
function cerrarModal() {
  document.getElementById('modalEditar').style.display = 'none';
}

// Guardar los cambios
document.getElementById('formEditar').addEventListener('submit', async e => {
  e.preventDefault();
  
  if (!confirm('⚠️ ¿Guardar los cambios realizados?')) {
    return;
  }
  
  const id = parseInt(document.getElementById('edit-id').value);
  
  const datos = {
    dueno_agencia: document.getElementById('edit-dueno_agencia').value,
    direccion: document.getElementById('edit-direccion').value || null,
    telefono: document.getElementById('edit-telefono').value || null,
    marca: document.getElementById('edit-marca').value,
    modelo: document.getElementById('edit-modelo').value,
    version: document.getElementById('edit-version').value || null,
    anio: parseInt(document.getElementById('edit-anio').value) || null,
    precio: parseFloat(document.getElementById('edit-precio').value) || 0,
    permuta: document.getElementById('edit-permuta').checked,
    contado: document.getElementById('edit-contado').checked,
    credito: document.getElementById('edit-credito').checked,
    deuda: parseFloat(document.getElementById('edit-deuda').value) || null,
    patentes_multas: document.getElementById('edit-patentes_multas').value || null,
    estado: document.getElementById('edit-estado').value || null,
    foto_frente_url: document.getElementById('edit-foto_frente_url').value || null,
    foto_lat_izq_url: document.getElementById('edit-foto_lat_izq_url').value || null,
    foto_lat_der_url: document.getElementById('edit-foto_lat_der_url').value || null,
    foto_trasera_url: document.getElementById('edit-foto_trasera_url').value || null,
    foto_motor_url: document.getElementById('edit-foto_motor_url').value || null,
    foto_interior_url: document.getElementById('edit-foto_interior_url').value || null,
    foto_ruedas_url: document.getElementById('edit-foto_ruedas_url').value || null,
    foto_extra1_url: document.getElementById('edit-foto_extra1_url').value || null,
    foto_extra2_url: document.getElementById('edit-foto_extra2_url').value || null,
    foto_extra3_url: document.getElementById('edit-foto_extra3_url').value || null
  };
  
  const { error } = await supabase.from('autos').update(datos).eq('id', id);
  
  if (error) {
    alert('❌ Error al guardar: ' + error.message);
  } else {
    alert('✅ Cambios guardados correctamente');
    cerrarModal();
    cargarAutos();
  }
});

// Eliminar con confirmación
async function confirmarEliminar(id) {
  if (!confirm('⚠️ ¿Estás SEGURO que querés eliminar este auto?\nEsta acción NO se puede deshacer.')) {
    return;
  }
  
  const { error } = await supabase.from('autos').delete().eq('id', id);
  
  if (error) {
    alert('❌ Error al eliminar: ' + error.message);
  } else {
    alert('✅ Auto eliminado correctamente');
    cargarAutos();
  }
}

// Iniciar
esperarSupabase();
</script>
</body>
</html>
