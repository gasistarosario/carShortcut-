<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Autos Cargados</title>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif;}
    body {background: #d4edf9; padding: 15px; max-width: 900px; margin: 0 auto;}
    h1 {text-align: center; color: #2d3748; margin-bottom: 25px; font-size: 22px;}
    .tarjeta {background: white; padding: 20px; border-radius: 12px; margin-bottom: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);}
    .titulo-auto {font-size: 18px; font-weight: 700; color: #2b6cb0; margin-bottom: 12px;}
    .fila {margin-bottom: 8px; color: #2d3748;}
    .fila strong {color: #4a5568; min-width: 110px; display: inline-block;}
    .etiqueta {display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 13px; margin: 4px 8px 4px 0;}
    .permuta {background: #fef5e7; color: #975a16;}
    .contado {background: #e6fffa; color: #047857;}
    .volver {display: inline-block; margin-top: 20px; color: #3182ce; text-decoration: none; font-weight: 600;}
    .volver:hover {text-decoration: underline;}
    .cargando {text-align: center; padding: 40px; color: #4a5568; font-size: 16px;}
    .vacio {text-align: center; padding: 40px 20px; color: #718096; font-size: 16px;}
    .boton-eliminar {margin-top: 12px; padding: 8px 16px; background: #fed7d7; color: #9b2c2c; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;}
    .boton-eliminar:hover {background: #feb2b2;}
  </style>
</head>
<body>

  <h1>📋 Autos Cargados</h1>

  <div id="listaAutos">
    <div class="cargando">🔄 Cargando autos...</div>
  </div>

  <a href="index.html" class="volver">← Volver a Ingresar Auto</a>

  <script>
    // === DATOS DE SUPABASE ===
    const SUPABASE_URL = "https://cgwdahvstitjksphucqk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gQicOTNud-uR22ur4-TJQw_hAgmkBfr";

    let sbClient = null;

    async function getSupabase() {
      if (!sbClient) {
        if (!window.supabase) {
          await new Promise(res => {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
            script.onload = res;
            document.head.appendChild(script);
          });
        }
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return sbClient;
    }

    async function mostrarAutos() {
      const caja = document.getElementById('listaAutos');
      const sb = await getSupabase();

      const { data: autos, error } = await sb
        .from('autos')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        caja.innerHTML = `<div class="vacio">❌ Error: ${error.message}</div>`;
        return;
      }

      if (!autos || autos.length === 0) {
        caja.innerHTML = `<div class="vacio">📭 Todavía no hay autos cargados</div>`;
        return;
      }

      caja.innerHTML = autos.map(auto => `
        <div class="tarjeta">
          <div class="titulo-auto">${auto.marca || ''} ${auto.modelo || ''} — ${auto.anio || ''}</div>
          <div class="fila"><strong>Versión:</strong> ${auto.version || '-'}</div>
          <div class="fila"><strong>Precio:</strong> ${auto.precio || '-'}</div>
          <div class="fila"><strong>Dueño:</strong> ${auto.dueno || '-'}</div>
          <div class="fila"><strong>Dirección:</strong> ${auto.direccion || '-'}</div>
          <div class="fila"><strong>Teléfono:</strong> ${auto.telefono || '-'}</div>
          <div>
            ${auto.permuta ? '<span class="etiqueta permuta">✅ Acepta permuta</span>' : ''}
            ${auto.contado ? '<span class="etiqueta contado">💵 Solo contado</span>' : ''}
          </div>
          <div class="fila" style="margin-top: 10px;"><strong>Deuda:</strong> ${auto.deuda || 'Sin deudas'}</div>
          <div class="fila"><strong>Descripción:</strong> ${auto.descripcion || '-'}</div>
          <button class="boton-eliminar" onclick="borrarAuto(${auto.id})">🗑️ Eliminar este auto</button>
        </div>
      `).join('');
    }

    async function borrarAuto(id) {
      if (!confirm('¿Seguro que querés eliminar este auto?')) return;
      const sb = await getSupabase();
      const { error } = await sb.from('autos').delete().eq('id', id);
      if (error) alert('❌ No se pudo eliminar: ' + error.message);
      else { alert('✅ Auto eliminado'); mostrarAutos(); }
    }

    mostrarAutos();
  </script>

</body>
</html>
