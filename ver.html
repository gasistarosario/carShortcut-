
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Vehículos Cargados</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif;}
    body {
      background: #87c5e8;
      padding: 15px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #1565C0;
      margin-bottom: 12px;
      font-size: 22px;
    }
    
    /* BOTÓN SIEMPRE VISIBLE — ARRIBA DE TODO */
    .boton-favorito {
      display: block !important;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin: 0 0 18px 0;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      transition: all 0.2s;
    }
    .boton-favorito:hover {transform: translateY(-2px);}

    /* CAJA DEL CÓDIGO */
    .caja-codigo {
      background: #f0f7ff;
      padding: 20px;
      border-radius: 12px;
      margin: 0 0 18px 0;
      border: 2px solid #bfdbfe;
      display: none;
    }
    .caja-codigo.mostrar {display: block;}
    .caja-codigo h3 {
      color: #1e40af;
      margin-bottom: 12px;
      font-size: 16px;
    }
    .input-codigo {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
      border: 2px solid #93c5fd;
      border-radius: 10px;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .boton-guardar {
      background: #16a34a;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
    }
    .boton-cancelar {
      background: #e5e7eb;
      color: #4b5563;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }

    .navegacion {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0 20px;
      padding: 12px;
      background: #fffaf0;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(21, 101, 192, 0.12);
    }
    .navegacion button {
      padding: 10px 20px;
      font-size: 15px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #1976D2;
      color: white;
      font-weight: 600;
      transition: all 0.2s;
    }
    .navegacion button:hover {
      background: #1565C0;
      transform: translateY(-1px);
    }
    .navegacion button:disabled {background: #cbd5e0; cursor: not-allowed; transform: none;}
    .contador {font-size: 16px; font-weight: bold; color: #2d3748;}

    .tarjeta {
      background: #fffaf0;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(21, 101, 192, 0.12);
      animation: aparecer 0.3s ease;
    }
    @keyframes aparecer {
      from {opacity: 0; transform: translateX(8px);}
      to {opacity: 1; transform: translateX(0);}
    }
    .etiqueta-tipo {
      display: inline-block;
      background: #e3f2fd;
      color: #1565C0;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      margin-bottom: 15px;
      font-size: 15px;
    }
    .titulo-auto {
      font-size: 20px;
      font-weight: 700;
      color: #1565C0;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e3f2fd;
    }
    .fila {
      margin-bottom: 10px;
      color: #2d3748;
      line-height: 1.6;
    }
    .fila strong {
      color: #2c5282;
      min-width: 130px;
      display: inline-block;
    }
    .etiqueta {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 13px;
      margin: 6px 8px 6px 0;
      font-weight: 600;
    }
    .permuta {background: #fef5e7; color: #975a16;}
    .contado {background: #e6fffa; color: #047857;}
    .volver {
      display: inline-block;
      margin-top: 25px;
      color: #1976D2;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 20px;
      background: #fffaf0;
      border-radius: 10px;
      transition: all 0.2s;
    }
    .volver:hover {
      background: #e3f2fd;
      text-decoration: none;
    }
    .cargando {
      text-align: center;
      padding: 60px 20px;
      color: #4a5568;
      font-size: 17px;
    }
    .vacio {
      text-align: center;
      padding: 60px 20px;
      color: #718096;
      font-size: 17px;
    }

    .fotos-titulo {
      margin-top: 22px;
      font-weight: 700;
      color: #1565C0;
      font-size: 17px;
      padding-top: 15px;
      border-top: 2px solid #e3f2fd;
    }
    .fotos-cuadricula {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }
    .foto-caja {
      text-align: center;
    }
    .foto-ver {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 10px;
      overflow: hidden;
      background: #f7fafc;
      border: 2px solid #e3f2fd;
      transition: transform 0.2s;
    }
    .foto-ver:hover {
      transform: scale(1.03);
    }
    .foto-ver img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .foto-nombre {
      font-size: 11px;
      color: #4a5568;
      padding: 5px 0;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <h1>📋 Vehículos Cargados</h1>

  <!-- BOTÓN SIEMPRE VISIBLE — ARRIBA DE TODO 💙 -->
  <button class="boton-favorito" onclick="mostrarCajaCodigo()">
    💙 AGREGAR A MIS VEHÍCULOS
  </button>

  <!-- CAJA PARA INGRESAR CÓDIGO -->
  <div id="cajaCodigo" class="caja-codigo">
    <h3>🔐 Escribí tu código</h3>
    <input type="text" id="codigoIngresado" class="input-codigo" placeholder="Tu código..." maxlength="6">
    <button class="boton-guardar" onclick="guardarConCodigo()">✅ Guardar</button>
    <button class="boton-cancelar" onclick="ocultarCajaCodigo()">❌ Cancelar</button>
  </div>

  <div class="navegacion">
    <button id="btnAnterior">◀ Anterior</button>
    <span id="contador" class="contador"></span>
    <button id="btnSiguiente">Siguiente ▶</button>
  </div>

  <div id="listaAutos">
    <div class="cargando">🔄 Cargando vehículos...</div>
  </div>

  <a href="index.html" class="volver">← Volver a la página principal</a>

  <script>
    const SUPABASE_URL = "https://cgwdahvstitjksphucqk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gQicOTNud-uR22ur4-TJQw_hAgmkBfr";

    const nombresFotos = [
      'Motor', 'Frente', 'Lateral Izquierdo', 'Lateral Derecho',
      'Parte Trasera', 'Interior 1', 'Interior 2', 'Interior 3',
      'Interior 4', 'Ruedas', 'Detalle Extra 1', 'Detalle Extra 2'
    ];

    let sbClient = null;
    let totalAutos = 0;
    let indiceActual = 0;
    let idsOrdenados = [];
    let idVehiculoActual = null;

    async function getSupabase() {
      if (!sbClient) {
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return sbClient;
    }

    async function contarVer() {
      const sb = await getSupabase();
      try {
        const { data } = await sb.from('visitas').select('cantidad').eq('pagina', 'ver');
        if (data && data.length > 0) {
          const nuevaCantidad = data[0].cantidad + 1;
          await sb.from('visitas').update({ cantidad: nuevaCantidad }).eq('pagina', 'ver');
        }
      } catch (err) {
        console.log('⚠️ Error contador:', err.message);
      }
    }

    // MOSTRAR Y OCULTAR CAJA DE CÓDIGO
    function mostrarCajaCodigo() {
      document.getElementById('cajaCodigo').classList.add('mostrar');
      document.getElementById('codigoIngresado').value = '';
      document.getElementById('codigoIngresado').focus();
    }

    function ocultarCajaCodigo() {
      document.getElementById('cajaCodigo').classList.remove('mostrar');
    }

    // GUARDAR CON CÓDIGO — SIN COMPARAR, DIRECTO ✅
    async function guardarConCodigo() {
      const codigo = document.getElementById('codigoIngresado').value.trim();
      
      if (!codigo) {
        alert('⚠️ Escribí tu código');
        return;
      }
      if (!idVehiculoActual) {
        alert('⚠️ No hay vehículo para guardar');
        return;
      }

      const sb = await getSupabase();

      // Obtenemos el contador actual del vehículo
      const { data: vehiculo, error: errorBusqueda } = await sb
        .from('autos')
        .select('contador')
        .eq('id', idVehiculoActual)
        .single();

      if (errorBusqueda || !vehiculo) {
        alert('❌ No se encuentra el vehículo');
        return;
      }

      const contadorActual = vehiculo.contador || 0;

      if (contadorActual >= 10) {
        alert('⛔ Este vehículo ya llegó al límite de 10 veces.');
        return;
      }

      const nuevoContador = contadorActual + 1;

      // Guardamos en mis_vehiculos con el código ingresado
      const { error: errorGuardar } = await sb.from('mis_vehiculos').insert({
        id_auto: idVehiculoActual,
        codigo: codigo
      });

      if (errorGuardar) {
        if (errorGuardar.code === '23505') {
          alert('ℹ️ Este vehículo ya está en tus favoritos');
        } else {
          alert('❌ Error al guardar: ' + errorGuardar.message);
        }
        return;
      }

      // Actualizamos el contador
      const { error: errorContador } = await sb
        .from('autos')
        .update({ contador: nuevoContador })
        .eq('id', idVehiculoActual);

      if (errorContador) {
        alert('⚠️ Se guardó pero no se pudo actualizar el contador');
        return;
      }

      alert(`✅ Guardado correctamente! Llevás ${nuevoContador} de 10 veces 🎉`);
      ocultarCajaCodigo();
    }

    async function contarYListar() {
      const sb = await getSupabase();
      const { count, data, error } = await sb
        .from('autos')
        .select('id', { count: 'exact', head: false })
        .order('id', { ascending: false });

      if (error || !data || data.length === 0) {
        document.getElementById('listaAutos').innerHTML = 
          `<div class="vacio">📭 Todavía no hay vehículos cargados</div>`;
        return false;
      }
      totalAutos = count;
      idsOrdenados = data.map(item => item.id);
      return true;
    }

    async function cargarUno(posicion) {
      if (posicion < 0 || posicion >= totalAutos) return;
      
      const caja = document.getElementById('listaAutos');
      caja.innerHTML = `<div class="cargando">🔄 Cargando vehículo ${posicion+1} de ${totalAutos}...</div>`;
      
      const sb = await getSupabase();
      const { data: auto, error } = await sb
        .from('autos')
        .select('*')
        .eq('id', idsOrdenados[posicion])
        .single();

      if (error || !auto) {
        caja.innerHTML = `<div class="vacio">❌ Error al cargar el vehículo</div>`;
        return;
      }

      idVehiculoActual = auto.id; // Guardamos el ID del auto que se está viendo

      let fotosHtml = '';
      for (let i = 1; i <= 12; i++) {
        const foto = auto[`foto${i}`];
        if (foto) {
          fotosHtml += `
            <div class="foto-caja">
              <div class="foto-ver"><img src="${foto}" alt="${nombresFotos[i-1]}"></div>
              <div class="foto-nombre">${nombresFotos[i-1]}</div>
            </div>
          `;
        }
      }
      const hayFotos = fotosHtml !== '';

      caja.innerHTML = `
      <div class="tarjeta">
        ${auto.tipo_vehiculo ? `<span class="etiqueta-tipo">${auto.tipo_vehiculo}</span>` : ''}
        
        <div class="titulo-auto">${auto.marca || ''} ${auto.modelo || ''} — ${auto.anio || ''}</div>
        
        <div class="fila"><strong>Versión:</strong> ${auto.version || '-'}</div>
        <div class="fila"><strong>Ciudad:</strong> ${auto.ciudad || '-'}</div>
        <div class="fila"><strong>Kilometraje:</strong> ${auto.kilometraje ? auto.kilometraje.toLocaleString('es-AR') + ' km' : 'No indicado'}</div>
        <div class="fila"><strong>Combustible:</strong> ${auto.combustible || '-'}</div>
        <div class="fila"><strong>Transmisión:</strong> ${auto.transmision || '-'}</div>
        <div class="fila"><strong>Precio:</strong> ${auto.precio || '-'}</div>
        <div class="fila"><strong>Dueño:</strong> ${auto.dueno || '-'}</div>
        <div class="fila"><strong>Dirección:</strong> ${auto.direccion || '-'}</div>
        <div class="fila"><strong>Teléfono:</strong> ${auto.telefono || '-'}</div>
        
        <div style="margin: 8px 0;">
          ${auto.permuta ? '<span class="etiqueta permuta">✅ Acepta permuta</span>' : ''}
          ${auto.contado ? '<span class="etiqueta contado">💵 Solo contado</span>' : ''}
        </div>
        
        <div class="fila"><strong>Deuda:</strong> ${auto.deuda || 'Sin deudas'}</div>
        <div class="fila"><strong>Descripción:</strong> ${auto.descripcion || '-'}</div>
        
        ${hayFotos ? `
        <div class="fotos-titulo">📸 Fotos del vehículo</div>
        <div class="fotos-cuadricula">${fotosHtml}</div>
        ` : ''}
      </div>
      `;
      document.getElementById('contador').textContent = `${posicion+1} de ${totalAutos}`;
    }

    async function autoAnterior() {
      if (totalAutos === 0) return;
      if (indiceActual === 0) {
        indiceActual = totalAutos - 1;
      } else {
        indiceActual--;
      }
      await cargarUno(indiceActual);
    }

    async function autoSiguiente() {
      if (totalAutos === 0) return;
      if (indiceActual === totalAutos - 1) {
        indiceActual = 0;
      } else {
        indiceActual++;
      }
      await cargarUno(indiceActual);
    }

    async function iniciar() {
      getSupabase().then(() => contarVer());
      
      const hayDatos = await contarYListar();
      if (hayDatos) {
        await cargarUno(0);
      }
    }

    document.getElementById('btnAnterior').addEventListener('click', autoAnterior);
    document.getElementById('btnSiguiente').addEventListener('click', autoSiguiente);

    iniciar();
  </script>

</body>
</html>
