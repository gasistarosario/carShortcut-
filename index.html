<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Auto con Foto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #111; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .contenedor { width: 100%; max-width: 500px; background: #222; padding: 20px; border-radius: 10px; margin-top: 10px; }
        .aviso { background: #ff9500; color: #000; text-align: center; padding: 8px; font-size: 12px; font-weight: bold; border-radius: 4px; margin-bottom: 15px; }
        
        /* Estilos de la cámara y previsualización */
        .camara-zona { position: relative; width: 100%; height: 250px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; }
        video, img { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; }
        
        label { display: block; margin: 10px 0 5px; color: #aaa; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; background: #333; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 16px; outline: none; }
        
        /* Botones */
        .btn-camara { position: absolute; bottom: 15px; background: rgba(0,0,0,0.7); border: 1px solid #fff; padding: 8px 15px; font-size: 14px; }
        .btn-principal { width: 100%; padding: 15px; background: #007aff; border: none; color: #fff; font-size: 16px; font-weight: bold; border-radius: 6px; margin-top: 20px; cursor: pointer; }
        button { color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        
        /* Vista de lo guardado */
        .tarjeta-guardada { background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-top: 20px; width: 100%; max-width: 500px; }
        .tarjeta-guardada img { height: 200px; border-radius: 6px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="contenedor">
        <div class="aviso">⚠️ SITIO EN DESARROLLO</div>
        
        <!-- Zona de Cámara Dinámica -->
        <div class="camara-zona">
            <video id="video" autoplay playsinline></video>
            <img id="fotoPrevia" style="display: none;" alt="Foto capturada">
            <button class="btn-camara" id="btnCapturar">📸 Tomar Foto</button>
        </div>
        <canvas id="canvas"></canvas>

        <!-- Formulario -->
        <form id="formularioAuto">
            <label>Título del Anuncio</label>
            <input type="text" id="titulo" placeholder="Ej: Porsche 911" required>

            <label>Precio (USD)</label>
            <input type="text" id="precio" placeholder="Ej: 150.000" required>

            <button type="submit" class="btn-principal">Guardar en la Página</button>
        </form>
    </div>

    <!-- Sección donde se muestra el auto guardado permanentemente -->
    <div id="vistaAnuncio"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const fotoPrevia = document.getElementById('fotoPrevia');
        const btnCapturar = document.getElementById('btnCapturar');
        let fotoBase64 = ""; // Aquí guardaremos el texto de la imagen

        // 1. Activar la cámara automáticamente al abrir la página
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.error("No se pudo acceder a la cámara: ", err); });

        // 2. Capturar la foto al tocar el botón de la cámara
        btnCapturar.addEventListener('click', () => {
            if (video.style.display !== "none") {
                // Tomar la foto desde el video
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                // Convertir la foto en un formato de texto largo (Base64)
                fotoBase64 = canvas.toDataURL('image/jpeg');
                
                // Mostrar la imagen estática y ocultar el video en vivo
                fotoPrevia.src = fotoBase64;
                fotoPrevia.style.display = "block";
                video.style.display = "none";
                btnCapturar.innerText = "🔄 Repetir Foto";
            } else {
                // Volver a activar el video en vivo si quiere repetir la foto
                fotoPrevia.style.display = "none";
                video.style.display = "block";
                btnCapturar.innerText = "📸 Tomar Foto";
                fotoBase64 = "";
            }
        });

        // 3. Guardar el auto completo en la memoria de la página al hacer el envío
        document.getElementById('formularioAuto').addEventListener('submit', function(event) {
            event.preventDefault();

            if (!fotoBase64) {
                alert("Por favor, toma una foto primero.");
                return;
            }

            const autoGuardado = {
                titulo: document.getElementById('titulo').value,
                precio: document.getElementById('precio').value,
                foto: fotoBase64
            };

            // Guardar en el disco duro del navegador
            localStorage.setItem('autoAnuncio', JSON.stringify(autoGuardado));
            
            // Refrescar la vista para mostrarlo
            mostrarAutoGuardado();
        });

        // 4. Buscar si ya había un auto guardado antes y mostrarlo en pantalla
        function mostrarAutoGuardado() {
            const datos = localStorage.getItem('autoAnuncio');
            const contenedorVista = document.getElementById('vistaAnuncio');
            
            if (datos) {
                const auto = JSON.parse(datos);
                contenedorVista.innerHTML = `
                    <div class="tarjeta-guardada">
                        <h3 style="margin-bottom: 10px; color: #ff9500;">🚗 PUBLICADO EN LA PÁGINA:</h3>
                        <img src="${auto.foto}">
                        <h2>${auto.titulo}</h2>
                        <p style="color: #4cd964; font-size: 18px; font-weight: bold; margin-top: 5px;">$${auto.precio} USD</p>
                    </div>
                `;
            }
        }

        // Mostrar el auto guardado apenas entres a la página
        mostrarAutoGuardado();
    </script>

</body>
</html>
