

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autos en Venta</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #d4edf9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .caja-principal {
      background: #ffffff;
      border-radius: 20px;
      padding: 45px 35px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 6px 20px rgba(49, 130, 206, 0.15);
      text-align: center;
    }

    h1 {
      color: #2b6cb0;
      font-size: 34px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .caja-acceso {
      margin-bottom: 10px;
    }

    .caja-acceso input {
      width: 100%;
      padding: 15px;
      border: 2px solid #90cdf4;
      border-radius: 12px;
      font-size: 17px;
      margin-bottom: 15px;
      text-align: center;
    }

    .caja-acceso input:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,0.2);
    }

    .boton-entrar {
      width: 100%;
      padding: 14px;
      background: #3182ce;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 10px;
    }

    .boton-entrar:hover {
      background: #2b6cb0;
      transform: translateY(-2px);
    }

    .error {
      color: #9b2c2c;
      margin-top: 12px;
      display: none;
      font-weight: 500;
    }

    .menu-opciones {
      display: none;
      margin-top: 10px;
    }

    .boton {
      display: block;
      background: #3182ce;
      color: #ffffff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 600;
      padding: 18px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .boton:hover {
      background: #2b6cb0;
      transform: translateY(-2px);
    }

    .boton-cerrar {
      background: #718096;
      font-size: 17px;
      padding: 14px 20px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="caja-principal">
    <h1>🚗 Autos en Venta</h1>

    <div id="cajaAcceso" class="caja-acceso">
      <input type="text" id="usuario" placeholder="Nombre de usuario">
      <input type="password" id="contrasena" placeholder="Contraseña">
      <button class="boton-entrar" onclick="verificar()">🔑 Entrar</button>
      <p id="mensajeError" class="error">❌ Usuario o contraseña incorrectos</p>
    </div>

    <div id="menuOpciones" class="menu-opciones">
      <a href="cargar.html" class="boton">📄 Ingresar Auto</a>
      <a href="ver.html" class="boton">📋 Ver Autos Cargados</a>
      <a href="buscar.html" class="boton">🔍 Buscar Auto</a>
      <button class="boton boton-cerrar" onclick="cerrarSesion()">🚪 Cerrar sesión</button>
    </div>
  </div>

  <script>
    const USUARIO_CORRECTO = "Eduardo";
    const CONTRASENA_CORRECTA = "Homero2030";

    window.onload = function() {
      if (localStorage.getItem('autorizado') === 'si') {
        document.getElementById('cajaAcceso').style.display = 'none';
        document.getElementById('menuOpciones').style.display = 'block';
      }
    };

    function verificar() {
      const usuario = document.getElementById('usuario').value;
      const clave = document.getElementById('contrasena').value;
      const cajaAcceso = document.getElementById('cajaAcceso');
      const menu = document.getElementById('menuOpciones');
      const error = document.getElementById('mensajeError');

      if (usuario === USUARIO_CORRECTO && clave === CONTRASENA_CORRECTA) {
        localStorage.setItem('autorizado', 'si');
        cajaAcceso.style.display = 'none';
        menu.style.display = 'block';
      } else {
        error.style.display = 'block';
        document.getElementById('usuario').value = '';
        document.getElementById('contrasena').value = '';
      }
    }

    function cerrarSesion() {
      localStorage.removeItem('autorizado');
      window.location.reload();
    }

    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') verificar();
    });
  </script>

</body>
</html>
