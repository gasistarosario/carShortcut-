

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomar y Guardar Foto Automático</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f9;
        }
        video, #resultado-foto {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            background-color: #ccc;
            margin-bottom: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        #resultado-foto {
            border: 3px solid #28a745;
            display: none; /* Oculto hasta tomar la foto */
        }
        canvas {
            display: none; /* Trabajando en segundo plano */
        }
        .contenedor-botones {
            margin-top: 15px;
            margin-bottom: 20px;
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: background 0.2s;
        }
        button:active {
            background-color: #0056b3;
        }
        #mensaje-servidor {
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <h2>Captura y Envío Automático</h2>
    
    <p>Cámara en vivo:</p>
    <video id="camara" autoplay playsinline></video>
    
    <div class="contenedor-botones">
        <!-- Único botón: captura, muestra y guarda a la vez -->
        <button id="boton-foto">📸 Tomar y Guardar Foto</button>
    </div>

    <p id="mensaje-servidor"></p>
    
    <p id="texto-resultado" style="display: none; font-weight: bold;">Foto capturada y enviada:</p>
    <img id="resultado-foto" alt="Tu foto aparecerá aquí">

    <!-- Canvas oculto para procesar la conversión a imagen -->
    <canvas id="canvas-oculto"></canvas>

    <script>
        const video = document.getElementById('camara');
        const canvas = document.getElementById('canvas-oculto');
        const imgResultado = document.getElementById('resultado-foto');
        const textoResultado = document.getElementById('texto-resultado');
        const mensajeServidor = document.getElementById('mensaje-servidor');
        const botonFoto = document.getElementById('boton-foto');
        const ctx = canvas.getContext('2d');

        // 1. Iniciar la cámara trasera del celular automáticamente
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment" }, 
            audio: false 
        })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            console.error("Error de cámara: ", err);
            alert("Por favor, permite el acceso a la cámara.");
        });

        // 2. Evento al presionar el botón de capturar
        botonFoto.addEventListener('click', () => {
            // Ajustar el canvas al tamaño del video del celular
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Dibujar el fotograma actual en el canvas oculto
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convertir el canvas a formato de texto de imagen (Base64)
            const uriImagen = canvas.toDataURL("image/png");
            
            // Mostrar la foto capturada en la pantalla de inmediato
            imgResultado.src = uriImagen;
            imgResultado.style.display = "block";
            textoResultado.style.display = "block";
            
            // Notificar al usuario que el envío está en proceso
            mensajeServidor.style.color = "#007bff";
            mensajeServidor.innerText = "Subiendo foto al servidor...";

            // 3. ENVÍO AUTOMÁTICO AL SERVIDOR (guardar.php)
            const formData = new FormData();
            formData.append('foto_base64', uriImagen);

            fetch('guardar.php', {
                method: 'POST',
                body: formData
            })
            .then(respuesta => respuesta.text())
            .then(resultado => {
                // Mostrar en pantalla la respuesta que da tu archivo PHP
                mensajeServidor.style.color = "#28a745";
                mensajeServidor.innerText = resultado; 
            })
            .catch(error => {
                console.error("Error al subir:", error);
                mensajeServidor.style.color = "#dc3545";
                mensajeServidor.innerText = "Error: No se pudo guardar la foto.";
            });
        });
    </script>
</body>
</html>
