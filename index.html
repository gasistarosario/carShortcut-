
<!DOCTYPE html>
html lang="es">
 <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Catálogo de Autos en Venta</title>
   <!-- Cargar Supabase -->
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <script>
     // === TUS DATOS DE CONEXIÓN ===
     const SUPABASE_URL = "https://cgwdahvstltjkzphucq.supabase.co";
     
     // 👇 PEGÁ TU CLAVE PUBLISHABLE ENTRE ESTAS COMILLAS 👇
     const SUPABASE_ANON_KEY = "PEGÁ_TU_CLAVE_AQUÍ";
     // Conectar automáticamente
     const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
   </script>
 </head>
 <body>
   <h1>Catálogo de Autos en Venta</h1>
   <h2>Registrar Nuevo Auto</h2>
   <form id="formulario-auto">
     <label>Modelo / Nombre:</label><br>
     <input type="text" id="modelo" placeholder="Ej: Toyota Corolla 2023" required><br><br>
     <label>Precio (USD):</label><br>
     <input type="number" id="precio" placeholder="Ej: 25000" required><br><br>
     <label>Descripción:</label><br>
     <textarea id="descripcion" placeholder="Detalles del vehículo..."></textarea><br><br>
     <button type="submit" style="padding:10px 25px; font-size:16px; background:#00bfa5; color:white; border:none; border-radius:5px; cursor:pointer;">Guardar Auto</button>
   </form>
   <script>
     const formulario = document.getElementById('formulario-auto');
     formulario.addEventListener('submit', async (e) => {
       e.preventDefault();
       const modelo = document.getElementById('modelo').value;
       const precio = parseFloat(document.getElementById('precio').value);
       const descripcion = document.getElementById('descripcion').value;
       // Toma la primera palabra como marca
       const marca = modelo.split(' ')[0];
       const { error } = await supabase.from('autos').insert([{
         marca: marca,
         modelo: modelo,
         precio: precio,
         descripcion: descripcion
       }]);
       if (error) {
         alert("❌ Error: " + error.message);
         console.error(error);
       } else {
         alert("✅ ¡Auto guardado correctamente! 🚗✨");
         formulario.reset();
       }
     });
   </script>
 </body>
 </html>
