<!-- === CONTADOR DE VISITAS — PÁGINA PRINCIPAL === -->
<script>
async function contarVisitaPrincipal() {
  console.log('🔄 Contando visita...');
  
  try {
    const { data, error } = await supabaseClient
      .from('visitas')
      .select('cantidad')
      .eq('pagina', 'principal');

    if (error) {
      console.log('❌ Error al buscar:', error);
      return;
    }

    if (data.length === 0) {
      await supabaseClient
        .from('visitas')
        .insert([{ pagina: 'principal', cantidad: 1 }]);
      console.log('✅ Creada → principal: 1');
      
    } else {
      const nuevaCantidad = data[0].cantidad + 1;
      await supabaseClient
        .from('visitas')
        .update({ cantidad: nuevaCantidad })
        .eq('pagina', 'principal');
      console.log('✅ Principal ahora es:', nuevaCantidad);
    }
    
  } catch (err) {
    console.log('❌ Error:', err.message);
  }
}

contarVisitaPrincipal();
</script>
