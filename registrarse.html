<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - Vehículos en Venta</title>
  <link rel="manifest" href="app.webmanifest">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, 'Open Sans', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .caja {
      background: linear-gradient(135deg, #f7f3eb 0%, #eee9dd 100%);
      border-radius: 28px;
      padding: 45px 35px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(44,82,130,0.08);
      border: 1px solid #e2d9c8;
      animation: entradaSuave 0.7s ease-out;
    }
    @keyframes entradaSuave {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      color: #2c5282;
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitulo {
      color: #5a6872;
      text-align: center;
      margin-bottom: 30px;
      font-size: 15px;
    }
    .campo {
      margin-bottom: 20px;
      position: relative;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #4a5568;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 14px 50px 14px 16px;
      border: 2px solid #c5d6e8;
      border-radius: 12px;
      font-size: 16px;
      background: #fff;
      transition: all 0.2s ease;
    }
    input:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,0.12);
    }
    .ojito {
      position: absolute;
      right: 14px;
      bottom: 14px;
      cursor: pointer;
      font-size: 20px;
      user-select: none;
    }
    .boton {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(49,130,206,0.15);
    }
    .boton:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #4a90d9 0%, #3182ce 100%);
    }
    .boton:disabled {
      background: #a0aec0;
      cursor: not-allowed;
      transform: none;
      opacity: 0.7;
    }
    .mensaje {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      display: none;
      font-weight: 600;
      font-size: 14px;
      text-align: center;
    }
    .exito {
      background: #f0fff4;
      border: 2px solid #9ae6b4;
      color: #276749;
    }
    .error {
      background: #fff5f5;
      border: 2px solid #feb2b2;
      color: #c53030;
    }
    .volver {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #3182ce;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .volver:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="caja">
    <h1>✨ Crear Cuenta</h1>
    <p class="subtitulo">Ingresá tus datos para registrarte</p>

    <form id="formRegistro">
      <div class="campo">
        <label for="nombre">Tu nombre</label>
        <input type="text" id="nombre" required placeholder="Escribí tu nombre">
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" required placeholder="tu@correo.com">
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" required placeholder="Elegí una contraseña">
        <span class="ojito" id="ojito1">👁️</span>
      </div>

      <div class="campo">
        <label for="repetir_contrasena">Repetir contraseña</label>
        <input type="password" id="repetir_contrasena" required placeholder="Escribí la misma contraseña">
        <span class="ojito" id="ojito2">👁️</span>
      </div>

      <button type="submit" id="btnRegistrar" class="boton">Registrarme ✅</button>
    </form>

    <div id="mensaje" class="mensaje"></div>

    <a href="index.html" class="volver">← Volver al inicio</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://ikancehiaanhnuuykkio.supabase.co';     //https://cgwdahvstitjksphucqk.supabase.co
    const SUPABASE_KEY = 'sb_publishable_Cqf0RB-aS7OUCUMQJ0k_Sg_-Qkdht3b';      //sb_publishable_gQicOTNud-uR22ur4-TJQw_hAgmkBfr
    
    // ✅ Sin errores de duplicado
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Funciones para mostrar/ocultar contraseña
    const contrasena = document.getElementById('contrasena');
    const repetirContrasena = document.getElementById('repetir_contrasena');
    const ojito1 = document.getElementById('ojito1');
    const ojito2 = document.getElementById('ojito2');

    ojito1.addEventListener('click', () => {
      contrasena.type = contrasena.type === 'password' ? 'text' : 'password';
      ojito1.textContent = contrasena.type === 'password' ? '👁️' : '🙈';
    });

    ojito2.addEventListener('click', () => {
      repetirContrasena.type = repetirContrasena.type === 'password' ? 'text' : 'password';
      ojito2.textContent = repetirContrasena.type === 'password' ? '👁️' : '🙈';
    });

    const formRegistro = document.getElementById('formRegistro');
    const btnRegistrar = document.getElementById('btnRegistrar');
    const mensaje = document.getElementById('mensaje');

    formRegistro.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnRegistrar.disabled = true;
      mensaje.style.display = 'none';

      const nombre = document.getElementById('nombre').value.trim();
      const correo = document.getElementById('correo').value.trim();
      const pass1 = document.getElementById('contrasena').value;
      const pass2 = document.getElementById('repetir_contrasena').value;

      // ✅ Verificar que coincidan
      if (pass1 !== pass2) {
        mensaje.className = 'mensaje error';
        mensaje.innerHTML = '❌ Las contraseñas no coinciden. Revisalas por favor.';
        mensaje.style.display = 'block';
        btnRegistrar.disabled = false;
        return;
      }

      try {
        // 1. Crear usuario en Supabase Auth
        const { data: authData, error: authError } = await supabaseClient.auth.signUp({
          email: correo,
          password: pass1
        });

        if (authError) throw authError;

        // 2. Guardar datos en tabla usuarios
        const { error: dbError } = await supabaseClient.from('usuarios').insert([{
          id: authData.user.id,
          nombre: nombre,
          correo: correo,
          confirmado: false
        }]);

        if (dbError) throw dbError;

        // Éxito
        mensaje.className = 'mensaje exito';
        mensaje.innerHTML = '✅ ¡Listo! Te enviamos un correo para confirmar tu cuenta. Revisá tu bandeja de entrada.';
        mensaje.style.display = 'block';
        formRegistro.reset();

      } catch (err) {
        mensaje.className = 'mensaje error';
        mensaje.innerHTML = '❌ ' + err.message;
        mensaje.style.display = 'block';
      } finally {
        btnRegistrar.disabled = false;
      }
    });
  </script>

</body>
</html>
