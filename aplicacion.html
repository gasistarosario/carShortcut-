<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vehículos en Venta">
  <meta name="theme-color" content="#1565C0">
  <title>Instalar — Vehículos en Venta</title>
  <link rel="manifest" href="app.webmanifest">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, 'Open Sans', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .caja {
      background: linear-gradient(135deg, #f7f3eb 0%, #eee9dd 100%);
      border-radius: 28px;
      padding: 50px 35px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(44, 82, 130, 0.08);
      border: 1px solid #e2d9c8;
    }
    h1 {
      color: #2c5282;
      font-size: 28px;
      margin-bottom: 15px;
    }
    .mensaje {
      color: #5a6872;
      font-size: 17px;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .boton-instalar {
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: white;
      border: none;
      font-size: 20px;
      font-weight: 700;
      padding: 20px 30px;
      border-radius: 16px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(49, 130, 206, 0.18);
      transition: all 0.3s ease;
    }
    .boton-instalar:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(49, 130, 206, 0.25);
    }
    .boton-instalar:disabled {
      background: #b0bec5;
      cursor: not-allowed;
      transform: none;
    }
    .volver {
      margin-top: 25px;
      color: #3182ce;
      text-decoration: none;
      font-size: 16px;
      display: inline-block;
    }
    .oculto {
      display: none;
    }
  </style>
</head>
<body>

  <div class="caja">
    <h1>📱 Instalar la Aplicación</h1>
    <p class="mensaje" id="texto-estado">
      Tocá el botón de abajo para agregar la aplicación a tu pantalla de inicio.<br>
      Así la tendrás siempre a mano, rápida y sin barras.
    </p>

    <button id="boton-instalar" class="boton-instalar">
      ⬇️ Instalar Aplicación
    </button>

    <p id="ya-instalada" class="mensaje oculto">
      ✅ La aplicación ya está instalada en tu celular.<br>
      Buscá el ícono en tu pantalla de inicio.
    </p>

    <a href="index.html" class="volver">← Volver al inicio</a>
  </div>

<script>
  let eventoInstalacionPendiente;

  // Guardamos el evento cuando el navegador está listo para instalar
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    eventoInstalacionPendiente = e;
    // El botón ya está visible, listo para tocar
  });

  // Cuando tocan el botón → se abre la ventanita de instalar
  document.getElementById('boton-instalar').addEventListener('click', async () => {
    if (!eventoInstalacionPendiente) {
      // Si no hay evento, mostramos cómo hacerlo manual
      alert('🔧 Tocá los tres puntitos arriba → "Agregar a pantalla de inicio"');
      return;
    }

    // Abrimos la ventana de instalación
    const resultado = await eventoInstalacionPendiente.prompt();
    
    if (resultado.outcome === 'accepted') {
      // Aceptó → ocultamos el botón y mostramos mensaje
      document.getElementById('boton-instalar').classList.add('oculto');
      document.getElementById('ya-instalada').classList.remove('oculto');
    }
    
    eventoInstalacionPendiente = null;
  });

  // Si ya está instalada → ocultamos el botón
  window.addEventListener('appinstalled', () => {
    document.getElementById('boton-instalar').classList.add('oculto');
    document.getElementById('ya-instalada').classList.remove('oculto');
  });
</script>

</body>
</html>
