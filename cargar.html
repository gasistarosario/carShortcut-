
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargar Vehiculo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #84a6c7; min-height: 100vh; padding: 20px; }
    .contenedor { max-width: 520px; margin: 0 auto; }
    .tarjeta { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    h2 { text-align: center; margin-bottom: 25px; color: #2563eb; }
    .campo { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; font-size: 14px; }
    input {
      width: 100%; padding: 12px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 15px;
    }
    .fila-doble { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .boton-guardar {
      width: 100%; padding: 16px; background: #2563eb; color: white;
      border: none; border-radius: 12px; font-size: 18px; font-weight: bold;
      margin-top: 10px; cursor: pointer;
    }
    .boton-guardar:hover { background: #1d4ed8; }
    .boton-volver {
      display: inline-block; margin-bottom: 20px; color: #2563eb;
      text-decoration: none; font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <a href="index.html" class="boton-volver">← Volver al inicio</a>
    <div class="tarjeta">
      <h2>📝 Cargar Vehiculo</h2>
      
      <form id="formAuto">
        <div class="fila-doble">
          <div class="campo">
            <label>Marca *</label>
            <input type="text" id="marca" required placeholder="Ej: Toyota">
          </div>
          <div class="campo">
            <label>Modelo *</label>
            <input type="text" id="modelo" required placeholder="Ej: Corolla">
          </div>
        </div>
        <div class="fila-doble">
          <div class="campo">
            <label>Version</label>
            <input type="text" id="version" placeholder="Ej: XLS / Sport">
          </div>
          <div class="campo">
            <label>Anio</label>
            <input type="number" id="anio" placeholder="Ej: 2018">
          </div>
        </div>
        <div class="campo">
          <label>Precio ($) *</label>
          <input type="number" step="0.01" id="precio" required placeholder="Valor del vehiculo">
        </div>
        <div class="campo">
          <label>Dueno o Agencia *</label>
          <input type="text" id="dueno" required placeholder="Nombre o razon social">
        </div>
        <div class="campo">
          <label>Direccion</label>
          <input type="text" id="direccion" placeholder="Calle y numero, ciudad">
        </div>
        <div class="campo">
          <label>Telefono</label>
          <input type="text" id="telefono" placeholder="Ej: 341 1234567">
        </div>
        
        <button type="submit" class="boton-guardar">✅ Guardar Vehiculo</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cgdahvstitjksphucqk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gQlcOTNud-ur22ur4-TJQw_hAgmkBfr";
    
    const { createClient } = supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('formAuto');
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const datos = {
        marca: document.getElementById('marca').value,
        modelo: document.getElementById('modelo').value,
        version: document.getElementById('version').value || null,
        anio: document.getElementById('anio').value ? parseInt(document.getElementById('anio').value) : null,
        precio: parseFloat(document.getElementById('precio').value),
        dueno: document.getElementById('dueno').value,
        direccion: document.getElementById('direccion').value,
        telefono: document.getElementById('telefono').value
      };

      const { error } = await supabase
        .from('autos')
        .insert([datos]);

      if (error) {
        alert('❌ No se pudo guardar:\n' + error.message);
        console.error('Error:', error);
      } else {
        alert('✅ Auto guardado correctamente');
        form.reset();
        window.location.href = 'ver.html';
      }
    });
  </script>
</body>
</html>
