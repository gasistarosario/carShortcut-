
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar Vehículo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    /* ✅ FONDO DE LA PÁGINA CELESTE */
    body {
      background: #d4edf9;  /* Celeste suave */
      padding: 15px;
      max-width: 850px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #2d3748;
      margin-bottom: 25px;
      font-size: 22px;
    }
    .form-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .fila {
      display: flex;
      gap: 15px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .campo {
      flex: 1 1 45%;
      min-width: 160px;
    }
    .campo-completo {
      flex: 1 1 100%;
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #4a5568;
      font-size: 14px;
    }
    /* ✅ TODOS LOS CAMPOS BLANCOS, INCLUIDO DESCRIPCIÓN */
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      background: white;  /* Blanco */
    }
    input::placeholder, textarea::placeholder {
      color: #a0aec0;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,0.2);
    }
    .fila-chk {
      display: flex;
      gap: 30px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .campo-chk {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .campo-chk input {
      width: auto;
      margin: 0;
    }
    .boton {
      width: 100%;
      padding: 14px;
      background: #3182ce;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .boton:hover { background: #2b6cb0; }
    .boton:disabled { background: #a0aec0; cursor: not-allowed; }
    .mensaje {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-weight: 500;
      font-size: 15px;
    }
    .exito { background: #f0fff4; color: #22543d; border: 1px solid #9ae6b4; }
    .error { background: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; }
    .volver {
      display: inline-block;
      margin-top: 18px;
      color: #3182ce;
      text-decoration: none;
      font-weight: 500;
    }
    .volver:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>🚗 Ingresar Vehículo</h1>

  <div class="form-container">
    <form id="formAuto">
      
      <div class="fila">
        <div class="campo">
          <label>Marca</label>
          <input type="text" id="marca" placeholder="Ej: Toyota, Ford, Chevrolet" required>
        </div>
        <div class="campo">
          <label>Modelo</label>
          <input type="text" id="modelo" placeholder="Ej: Corolla, Fiesta, Cruze" required>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label>Versión</label>
          <input type="text" id="version" placeholder="Ej: XEi, 1.6 LT, Limited" required>
        </div>
        <div class="campo">
          <label>Año</label>
          <input type="number" id="anio" placeholder="Ej: 2018" required>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label>Precio</label>
          <input type="text" id="precio" placeholder="Ej: 12.500.000 o USD 8.500" required>
        </div>
        <div class="campo">
          <label>Dueño / Agencia</label>
          <input type="text" id="dueno" placeholder="Ej: Juan Pérez o Autos SRL" required>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label>Dirección</label>
          <input type="text" id="direccion" placeholder="Ej: Av. San Martín 1234, Rosario" required>
        </div>
        <div class="campo">
          <label>Teléfono / WhatsApp</label>
          <input type="tel" id="telefono" placeholder="Ej: +54 9 341 123-4567" required>
        </div>
      </div>

      <div class="fila-chk">
        <div class="campo-chk">
          <input type="checkbox" id="permuta">
          <label for="permuta">Acepta permuta</label>
        </div>
        <div class="campo-chk">
          <input type="checkbox" id="contado">
          <label for="contado">Solo contado</label>
        </div>
      </div>

      <div class="campo-completo">
        <label>Deuda / Patentes / Multas</label>
        <textarea id="deuda" rows="2" placeholder="Ej: Sin deudas / Patente al día / Deuda $15.000"></textarea>
      </div>

      <!-- ✅ DESCRIPCIÓN BLANCA COMO ANTES -->
      <div class="campo-completo">
        <label>Descripción</label>
        <textarea id="descripcion" rows="4" placeholder="Ej: Único dueño, aire acondicionado, alarma, cubiertas nuevas, listo para transferir..."></textarea>
      </div>

      <button type="submit" class="boton" id="btnGuardar">💾 Guardar Auto</button>
      
      <div id="mensaje" class="mensaje"></div>
    </form>

    <a href="index.html" class="volver">← Volver al inicio</a>
  </div>

  <script>
    // === PONÉ TUS DATOS DE SUPABASE AQUÍ ===
    const SUPABASE_URL = "https://cgwdahvstitjksphucqk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gQicOTNud-uR22ur4-TJQw_hAgmkBfr";

    async function cargarSupabase() {
      if (!window.supabase) {
        await new Promise(res => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
          s.onload = res;
          document.head.appendChild(s);
        });
      }
      return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    document.getElementById('formAuto').addEventListener('submit', async e => {
      e.preventDefault();
      
      const btn = document.getElementById('btnGuardar');
      const mensaje = document.getElementById('mensaje');
      
      btn.disabled = true;
      btn.textContent = "Guardando...";
      mensaje.style.display = "none";

      try {
        const supabase = await cargarSupabase();

        const datos = {
          marca: document.getElementById('marca').value.trim(),
          modelo: document.getElementById('modelo').value.trim(),
          version: document.getElementById('version').value.trim(),
          anio: parseInt(document.getElementById('anio').value),
          precio: document.getElementById('precio').value.trim(),
          dueno: document.getElementById('dueno').value.trim(),
          direccion: document.getElementById('direccion').value.trim(),
          telefono: document.getElementById('telefono').value.trim(),
          permuta: document.getElementById('permuta').checked,
          contado: document.getElementById('contado').checked,
          deuda: document.getElementById('deuda').value.trim(),
          descripcion: document.getElementById('descripcion').value.trim()
        };

        const { error } = await supabase
          .from('autos')
          .insert([datos]);

        if (error) throw error;

        mensaje.textContent = "✅ Auto guardado correctamente";
        mensaje.className = "mensaje exito";
        mensaje.style.display = "block";
        document.getElementById('formAuto').reset();

      } catch (err) {
        console.error("Error:", err);
        mensaje.textContent = "❌ Error: " + err.message;
        mensaje.className = "mensaje error";
        mensaje.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "💾 Guardar Auto";
      }
    });
  </script>

</body>
</html>
