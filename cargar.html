
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar Vehículo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    body {
      background: #d4edf9;
      padding: 15px;
      max-width: 850px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #2d3748;
      margin-bottom: 15px;
      font-size: 22px;
    }
    .aviso-seguridad {
      background: #fef5e7;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 20px;
      color: #744210;
      border-left: 4px solid #ed8936;
      font-size: 14px;
      line-height: 1.5;
    }
    .form-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .fila {
      display: flex;
      gap: 15px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .campo {
      flex: 1 1 45%;
      min-width: 160px;
    }
    .campo-completo {
      flex: 1 1 100%;
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #4a5568;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }
    input::placeholder, textarea::placeholder {
      color: #a0aec0;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,0.2);
    }
    .fila-chk {
      display: flex;
      gap: 30px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .campo-chk {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .campo-chk input {
      width: auto;
      margin: 0;
    }
    .boton {
      width: 100%;
      padding: 14px;
      background: #3182ce;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .boton:hover { background: #2b6cb0; }
    .boton:disabled { background: #a0aec0; cursor: not-allowed; }
    .mensaje {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-weight: 500;
      font-size: 15px;
    }
    .exito { background: #f0fff4; color: #22543d; border: 1px solid #9ae6b4; }
    .error { background: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; }
    .volver {
      display: inline-block;
      margin-top: 18px;
      color: #3182ce;
      text-decoration: none;
      font-weight: 500;
    }
    .volver:hover { text-decoration: underline; }

    .foto-seccion {
      margin: 25px 0 15px;
    }
    .foto-titulo-seccion {
      font-size: 19px;
      font-weight: 700;
      color: #2b6cb0;
      margin-bottom: 18px;
    }
    .foto-tarjeta {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      background: linear-gradient(to right, #f0f7ff, #ebf8ff);
      border-radius: 14px;
      border: 2px solid #90cdf4;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .foto-tarjeta:active {
      transform: scale(0.98);
      border-color: #3182ce;
    }
    .foto-nombre {
      font-weight: 700;
      font-size: 16px;
      color: #2c5282;
      flex: 1;
    }
    .foto-mini {
      width: 80px;
      height: 60px;
      border-radius: 8px;
      overflow: hidden;
      background: #f7fafc;
      border: 2px dashed #cbd5e0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .foto-mini-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .foto-sin {
      font-size: 11px;
      color: #a0aec0;
    }
    .foto-input-oculto {
      display: none;
    }
    .oculto {
      display: none;
    }
  </style>
</head>
<body>

  <h1>🚗 Ingresar Vehículo</h1>

  <div class="aviso-seguridad">
    🔐 <strong>Importante:</strong> Escribí acá tu código de seguridad. Lo vas a necesitar después para poder eliminar este vehículo cuando lo encuentres en la búsqueda. Guardalo bien.
  </div>

  <div class="form-container">
    <form id="formAuto">
      
      <div class="campo-completo">
        <label>🔑 Código de Seguridad *</label>
        <input type="password" id="codigo_seguridad" placeholder="Escribí tu código para poder eliminar después" required>
      </div>

      <div class="fila">
        <div class="campo-completo">
          <label>Tipo de Vehículo *</label>
          <select id="tipo_vehiculo" required>
            <option value="">Seleccionar...</option>
            <option value="Auto">🚗 Auto</option>
            <option value="Camioneta">🚙 Camioneta / Pick-up</option>
            <option value="4x4">⛰️ 4x4 / Todoterreno</option>
            <option value="SUV">🏔️ SUV / Crossover</option>
            <option value="Furgon">📦 Furgón / Utilitario</option>
            <option value="Cuatriciclo">🏍️ Cuatriciclo</option>
          </select>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label>Marca</label>
          <input type="text" id="marca" placeholder="Ej: Toyota, Ford, Chevrolet" required>
        </div>
        <div class="campo">
          <label>Modelo</label>
          <input type="text" id="modelo" placeholder="Ej: Corolla, Fiesta, Cruze" required>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label>Versión</label>
          <input type="text" id="version" placeholder="Ej: XEi, 1.6 LT, Limited" required>
        </div>
        <!-- ⛽ COMBUSTIBLE ABAJO DE VERSIÓN -->
        <div class="campo">
          <label>⛽ Combustible</label>
          <select id="combustible">
            <option value="">Seleccionar...</option>
            <option>Nafta</option>
            <option>Diésel</option>
            <option>Eléctrico</option>
            <option>Híbrido</option>
          </select>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label>Año</label>
          <input type="number" id="anio" placeholder="Ej: 2018" required>
        </div>
        <!-- 🔄 TRANSMISIÓN ABAJO DE AÑO -->
        <div class="campo">
          <label>🔄 Transmisión</label>
          <select id="transmision">
            <option value="">Seleccionar...</option>
            <option>Manual</option>
            <option>Automática</option>
          </select>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label>Kilometraje</label>
          <input type="number" id="kilometraje" placeholder="Ej: 95000">
        </div>
        <div class="campo">
          <label>Precio</label>
          <input type="text" id="precio" placeholder="Ej: 12.500.000 o USD 8.500" required>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label>Dueño / Agencia</label>
          <input type="text" id="dueno" placeholder="Ej: Juan Pérez o Autos SRL" required>
        </div>
        <div class="campo">
          <label>Dirección</label>
          <input type="text" id="direccion" placeholder="Ej: Av. San Martín 1234, Rosario" required>
        </div>
      </div>

      <div class="fila">
        <!-- 🏙️ CIUDAD ABAJO DE DIRECCIÓN -->
        <div class="campo">
          <label>🏙️ Ciudad</label>
          <select id="ciudad">
            <option value="">Seleccionar...</option>
            <option>Beltrán</option>
            <option>Fray Luis Beltrán</option>
            <option>Funes</option>
            <option>Granadero Baigorria</option>
            <option>Roldán</option>
            <option>Rosario</option>
            <option>San Lorenzo</option>
            <option>Villa Gobernador Gálvez</option>
            <option>Otra ciudad</option>
          </select>
        </div>
        <div class="campo" id="campo_ciudad_libre" style="display:none;">
          <label>✍️ Escribí tu ciudad</label>
          <input type="text" id="ciudad_libre" placeholder="Tu ciudad...">
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label>Teléfono / WhatsApp</label>
          <input type="tel" id="telefono" placeholder="Ej: +54 9 341 123-4567" required>
        </div>
        <div class="campo-chk">
          <input type="checkbox" id="permuta">
          <label for="permuta">Acepta permuta</label>
        </div>
        <div class="campo-chk">
          <input type="checkbox" id="contado">
          <label for="contado">Solo contado</label>
        </div>
      </div>

      <div class="campo-completo">
        <label>Deuda / Patentes / Multas</label>
        <textarea id="deuda" rows="2" placeholder="Ej: Sin deudas / Patente al día / Deuda $15.000"></textarea>
      </div>

      <div class="campo-completo">
        <label>Descripción</label>
        <textarea id="descripcion" rows="4" placeholder="Ej: Único dueño, aire acondicionado, alarma, cubiertas nuevas, listo para transferir..."></textarea>
      </div>

      <div class="foto-seccion">
        <div class="foto-titulo-seccion">📸 Fotos del vehículo</div>

        <label class="foto-tarjeta">
          <div class="foto-nombre">📷 Motor
            <input type="file" class="foto-input-oculto" id="foto1" accept="image/*" capture="environment" onchange="verFoto(1, this)">
          </div>
          <div class="foto-mini">
            <img id="img1" class="foto-mini-img">
            <span id="sin1" class="foto-sin">Sin foto</span>
          </div>
        </label>

        <label class="foto-tarjeta">
          <div class="foto-nombre">📷 Frente
            <input type="file" class="foto-input-oculto" id="foto2" accept="image/*" capture="environment" onchange="verFoto(2, this)">
          </div>
          <div class="foto-mini">
            <img id="img2" class="foto-mini-img">
            <span id="sin2" class="foto-sin">Sin foto</span>
          </div>
        </label>

        <label class="foto-tarjeta">
          <div class="foto-nombre">📷 Lateral izquierdo
            <input type="file" class="foto-input-oculto" id="foto3" accept="image/*" capture="environment" onchange="verFoto(3, this)">
          </div>
          <div class="foto-mini">
            <img id="img3" class="foto-mini-img">
            <span id="sin3" class="foto-sin">Sin foto</span>
          </div>
        </label>

        <label class="foto-tarjeta">
          <div class="foto-nombre">📷 Lateral derecho
            <input type="file" class="foto-input-oculto" id="foto4" accept="image/*" capture="environment" onchange="verFoto(4, this)">
          </div>
          <div class="foto-mini">
            <img id="img4" class="foto-mini-img">
            <span id="sin4" class="foto-sin">Sin foto</span>
          </div>
        </label>

        <label class="foto-tarjeta">
          <div class="foto-nombre">📷 Parte trasera
            <input type="file" class="foto-input-oculto" id="foto5" accept="image/*" capture="environment" onchange="verFoto(5, this)">
          </div>
          <div class="foto-mini">
            <img id="img5" class="foto-mini-img">
            <span id="sin5" class="foto-sin">Sin foto</span>
          </div>
        </label>

        <label class="foto-tarjeta">
          <div class="foto-nombre">📷 Interior 1
            <input type="file" class="foto-input-oculto" id="foto6" accept="image/*" capture="environment" onchange="verFoto(6, this)">
          </div>
          <div class="foto-mini">
            <img id="img6" class="foto-mini-img">
            <span id="sin6" class="foto-sin">Sin foto</span>
          </div>
        </label>

        <label class="foto-tarjeta">
          <div class="foto-nombre">📷 Interior 2
            <input type="file" class="foto-input-oculto" id="foto7" accept="image/*" capture="environment" onchange="verFoto(7, this)">
          </div>
          <div class="foto-mini">
            <img id="img7" class="foto-mini-img">
            <span id="sin7" class="foto-sin">Sin foto</span>
          </div>
        </label>

        <label class="foto-tarjeta">
          <div class="foto-nombre">📷 Interior 3
            <input type="file" class="foto-input-oculto" id="foto8" accept="image/*" capture="environment" onchange="verFoto(8, this)">
          </div>
          <div class="foto-mini">
            <img id="img8" class="foto-mini-img">
            <span id="sin8" class="foto-sin">Sin foto</span>
          </div>
        </label>

        <label class="foto-tarjeta">
          <div class="foto-nombre">📷 Interior 4
            <input type="file" class="foto-input-oculto" id="foto9" accept="image/*" capture="environment" onchange="verFoto(9, this)">
          </div>
          <div class="foto-mini">
            <img id="img9" class="foto-mini-img">
            <span id="sin9" class="foto-sin">Sin foto</span>
          </div>
        </label>

        <label class="foto-tarjeta">
          <div class="foto-nombre">📷 Ruedas
            <input type="file" class="foto-input-oculto" id="foto10" accept="image/*" capture="environment" onchange="verFoto(10, this)">
          </div>
          <div class="foto-mini">
            <img id="img10" class="foto-mini-img">
            <span id="sin10" class="foto-sin">Sin foto</span>
          </div>
        </label>

        <label class="foto-tarjeta">
          <div class="foto-nombre">📷 Extras 1
            <input type="file" class="foto-input-oculto" id="foto11" accept="image/*" capture="environment" onchange="verFoto(11, this)">
          </div>
          <div class="foto-mini">
            <img id="img11" class="foto-mini-img">
            <span id="sin11" class="foto-sin">Sin foto</span>
          </div>
        </label>

        <label class="foto-tarjeta">
          <div class="foto-nombre">📷 Extras 2
            <input type="file" class="foto-input-oculto" id="foto12" accept="image/*" capture="environment" onchange="verFoto(12, this)">
          </div>
          <div class="foto-mini">
            <img id="img12" class="foto-mini-img">
            <span id="sin12" class="foto-sin">Sin foto</span>
          </div>
        </label>
      </div>

      <button type="submit" class="boton" id="btnGuardar">💾 Guardar Vehículo</button>
      <div id="mensaje" class="mensaje"></div>
    </form>

    <a href="index.html" class="volver">← Volver al inicio</a>
  </div>

  <script>
    const SUPABASE_URL = "https://cgwdahvstitjksphucqk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gQicOTNud-uR22ur4-TJQw_hAgmkBfr";

    // Mostrar campo libre si eligen "Otra ciudad"
    const selectCiudad = document.getElementById('ciudad');
    const campoLibre = document.getElementById('campo_ciudad_libre');
    selectCiudad.addEventListener('change', () => {
      campoLibre.style.display = selectCiudad.value === 'Otra ciudad' ? 'block' : 'none';
    });

    function verFoto(numero, input) {
      const img = document.getElementById(`img${numero}`);
      const sin = document.getElementById(`sin${numero}`);
      if (input.files && input.files[0]) {
        const lector = new FileReader();
        lector.onload = e => {
          img.src = e.target.result;
          img.style.display = 'block';
          sin.style.display = 'none';
        };
        lector.readAsDataURL(input.files[0]);
      }
    }

    function reducirFoto(archivo, maxAncho = 900, calidad = 0.75) {
      return new Promise(resolver => {
        const lector = new FileReader();
        lector.onload = e => {
          const img = new Image();
          img.onload = () => {
            const lienzo = document.createElement('canvas');
            let ancho = img.width, alto = img.height;
            if (ancho > maxAncho) { alto = alto * (maxAncho / ancho); ancho = maxAncho; }
            lienzo.width = ancho; lienzo.height = alto;
            const ctx = lienzo.getContext('2d');
            ctx.drawImage(img, 0, 0, ancho, alto);
            resolver(lienzo.toDataURL('image/jpeg', calidad));
          };
          img.src = e.target.result;
        };
        lector.readAsDataURL(archivo);
      });
    }

    async function leerArchivoComoTexto(archivo) {
      if (!archivo) return null;
      return await reducirFoto(archivo);
    }

    async function cargarSupabase() {
      return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { timeout: 30000 });
    }

    document.getElementById('formAuto').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btnGuardar');
      const mensaje = document.getElementById('mensaje');
      btn.disabled = true;
      btn.textContent = "Guardando...";
      mensaje.style.display = "none";

      try {
        const supabase = await cargarSupabase();
        const fotos = {};
        for (let i = 1; i <= 12; i++) {
          const input = document.getElementById(`foto${i}`);
          fotos[`foto${i}`] = await leerArchivoComoTexto(input.files[0]);
        }

        // Obtener ciudad: lista o escrita
        let ciudadValor = selectCiudad.value;
        if (ciudadValor === 'Otra ciudad') {
          ciudadValor = document.getElementById('ciudad_libre').value.trim();
        }

        const datos = {
          codigo_seguridad: document.getElementById('codigo_seguridad').value.trim(),
          tipo_vehiculo: document.getElementById('tipo_vehiculo').value,
          marca: document.getElementById('marca').value.trim(),
          modelo: document.getElementById('modelo').value.trim(),
          version: document.getElementById('version').value.trim(),
          combustible: document.getElementById('combustible').value,
          anio: parseInt(document.getElementById('anio').value),
          transmision: document.getElementById('transmision').value,
          kilometraje: document.getElementById('kilometraje').value 
            ? parseInt(document.getElementById('kilometraje').value) 
            : null,
          precio: document.getElementById('precio').value.trim(),
          dueno: document.getElementById('dueno').value.trim(),
          direccion: document.getElementById('direccion').value.trim(),
          ciudad: ciudadValor,
          telefono: document.getElementById('telefono').value.trim(),
          permuta: document.getElementById('permuta').checked,
          contado: document.getElementById('contado').checked,
          deuda: document.getElementById('deuda').value.trim(),
          descripcion: document.getElementById('descripcion').value.trim(),
          ...fotos
        };

        const { error } = await supabase.from('autos').insert([datos]);
        if (error) throw error;

        mensaje.textContent = "✅ Vehículo guardado correctamente";
        mensaje.className = "mensaje exito";
        mensaje.style.display = "block";
        document.getElementById('formAuto').reset();
        
        // Ocultar campo ciudad libre al reiniciar
        campoLibre.style.display = 'none';
        
        for (let i = 1; i <= 12; i++) {
          document.getElementById(`img${i}`).style.display = 'none';
          document.getElementById(`sin${i}`).style.display = 'block';
        }
      } catch (err) {
        console.error("Error:", err);
        mensaje.textContent = "❌ Error: " + err.message;
        mensaje.className = "mensaje error";
        mensaje.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "💾 Guardar Vehículo";
      }
    });
  </script>
</body>
</html>
