<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar Vehículo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif;}
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      padding: 20px;
      min-height: 100vh;
    }
    .contenedor {max-width: 620px; margin: 0 auto;}

    h1 {
      text-align: center;
      color: #2c5282;
      margin-bottom: 20px;
      font-size: 23px;
    }
    .aviso-seguridad {
      background: rgba(255, 255, 255, 0.6);
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 22px;
      color: #4a5568;
      border-left: 4px solid #6ba3d9;
      font-size: 14px;
      line-height: 1.6;
    }
    .buscador {
      background: linear-gradient(135deg, #f7f3eb 0%, #eee9dd 100%);
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(44, 82, 130, 0.08);
      margin-bottom: 22px;
      border: 1px solid #e2d9c8;
    }
    .leyenda {
      text-align: center;
      color: #5a6872;
      font-size: 14px;
      margin-bottom: 22px;
    }
    .campo {margin-bottom: 16px;}
    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: #4a5568;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #c5d6e8;
      border-radius: 10px;
      font-size: 15px;
      background: white;
      transition: all 0.2s;
      color: #4a5568;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.12);
    }
    .boton-buscar {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(49, 130, 206, 0.15);
    }
    .boton-buscar:hover {
      background: linear-gradient(135deg, #4a90d9 0%, #3182ce 100%);
      transform: translateY(-1px);
    }

    .navegacion {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(44, 82, 130, 0.08);
      opacity: 0.4;
      transition: opacity 0.3s;
    }
    .navegacion.activa {opacity: 1;}
    .navegacion button {
      padding: 11px 22px;
      font-size: 15px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: white;
      font-weight: 600;
      transition: all 0.2s;
    }
    .navegacion button:hover {
      background: linear-gradient(135deg, #4a90d9 0%, #3182ce 100%);
      transform: translateY(-1px);
    }
    .navegacion button:disabled {
      background: #c5d6e8;
      cursor: not-allowed;
      transform: none;
      opacity: 0.7;
    }
    .contador {
      font-size: 16px;
      font-weight: bold;
      color: #2c5282;
    }

    .tarjeta {
      background: linear-gradient(135deg, #f7f3eb 0%, #eee9dd 100%);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(44, 82, 130, 0.08);
      animation: aparecer 0.3s ease;
      margin-bottom: 20px;
      border: 1px solid #e2d9c8;
    }
    @keyframes aparecer {
      from {opacity: 0; transform: translateX(8px);}
      to {opacity: 1; transform: translateX(0);}
    }
    .etiqueta-tipo {
      display: inline-block;
      background: #ebf4fb;
      color: #2c5282;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      margin-bottom: 15px;
      font-size: 15px;
    }
    .titulo-vehiculo {
      font-size: 20px;
      font-weight: 700;
      color: #2c5282;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid #eaf0f6;
    }
    .fila {
      margin-bottom: 10px;
      color: #4a5568;
      line-height: 1.6;
    }
    .fila strong {
      color: #3182ce;
      min-width: 130px;
      display: inline-block;
    }
    .etiqueta {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      margin: 6px 10px 6px 0;
      font-weight: 600;
    }
    .permuta {background: #f3ede0; color: #925622;}
    .contado {background: #eaf4e9; color: #2f6b32;}

    .cargando {
      text-align: center;
      padding: 50px 20px;
      color: #5a6872;
      font-size: 17px;
    }
    .sin-resultado {
      text-align: center;
      padding: 50px 20px;
      color: #5a6872;
      font-size: 17px;
      background: linear-gradient(135deg, #f7f3eb 0%, #eee9dd 100%);
      border-radius: 16px;
      border: 1px solid #e2d9c8;
    }
    .volver {
      display: block;
      text-align: center;
      margin-top: 28px;
      color: #3182ce;
      text-decoration: none;
      font-weight: 600;
      padding: 12px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 10px;
      transition: all 0.2s;
    }
    .volver:hover {
      background: #ebf4fb;
      text-decoration: none;
    }

    .fotos-titulo {
      margin-top: 22px;
      font-weight: 700;
      color: #2c5282;
      font-size: 17px;
      padding-top: 15px;
      border-top: 2px solid #eaf0f6;
    }
    .fotos-cuadricula {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }
    .foto-caja {text-align: center;}
    .foto-ver {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 10px;
      overflow: hidden;
      background: #ebf4fb;
      border: 2px solid #dceaf5;
      transition: transform 0.2s;
    }
    .foto-ver:hover {transform: scale(1.03);}
    .foto-ver img {width: 100%; height: 100%; object-fit: cover;}
    .foto-nombre {
      font-size: 11px;
      color: #5a6872;
      padding: 5px 0;
      font-weight: 600;
    }

    .zona-eliminar {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px dashed #e0c5b8;
    }
    .titulo-eliminar {
      font-size: 15px;
      font-weight: 700;
      color: #b54434;
      margin-bottom: 12px;
    }
    .input-eliminar {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5b9b0;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 12px;
      background: #faf5f3;
      color: #4a5568;
    }
    .boton-eliminar {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .boton-eliminar:hover {
      background: linear-gradient(135deg, #ef5350 0%, #e53935 100%);
      transform: translateY(-1px);
    }
    .mensaje {
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      display: none;
      font-weight: 500;
    }
    .exito {
      background: #eaf4e9;
      color: #2f6b32;
      border: 1px solid #b8d8b9;
    }
    .error {
      background: #faf0f0;
      color: #b54434;
      border: 1px solid #e5b9b0;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1>🔍 Buscar Vehículo</h1>

    <div class="aviso-seguridad">
      🔐 El mismo código de seguridad que usaste para guardar el vehículo te servirá para eliminarlo cuando lo encuentres.
    </div>

    <div class="buscador">
      <p class="leyenda">Dejá vacío lo que no querés filtrar ✨</p>

      <div class="campo">
        <label>Tipo de Vehículo</label>
        <select id="buscar_tipo">
          <option value="">Todos los tipos</option>
          <option value="Auto">🚗 Auto</option>
          <option value="Camioneta">🚙 Camioneta / Pick-up</option>
          <option value="4x4">⛰️ 4x4 / Todoterreno</option>
          <option value="SUV">🏔️ SUV / Crossover</option>
          <option value="Furgón">📦 Furgón / Utilitario</option>
          <option value="Cuatriciclo">🏍️ Cuatriciclo</option>
        </select>
      </div>

      <div class="campo">
        <label>Marca</label>
        <input type="text" id="buscar_marca" placeholder="Ej: Toyota, Ford...">
      </div>
      <div class="campo">
        <label>Modelo</label>
        <input type="text" id="buscar_modelo" placeholder="Ej: Corolla, Fiesta...">
      </div>
      <div class="campo">
        <label>Año</label>
        <input type="text" id="buscar_anio" placeholder="Ej: 2020">
      </div>
      
      <div class="campo">
        <label>Ciudad</label>
        <select id="buscar_ciudad">
          <option value="">Todas las ciudades</option>
          <option value="Rosario">🏙️ Rosario</option>
          <option value="Santa Fe">🏛️ Santa Fe</option>
          <option value="Funes">🌳 Funes</option>
          <option value="Roldán">🚲 Roldán</option>
          <option value="Granadero Baigorria">🏡 Granadero Baigorria</option>
          <option value="Puerto General San Martín">⚓ Puerto Gral. San Martín</option>
          <option value="Villa Constitución">🏭 Villa Constitución</option>
          <option value="Otra ciudad">📍 Otra ciudad</option>
        </select>
      </div>

      <div class="campo">
        <label>Combustible</label>
        <select id="buscar_combustible">
          <option value="">Todos</option>
          <option value="Nafta">⛽ Nafta</option>
          <option value="Diésel">🛢️ Diésel</option>
          <option value="Eléctrico">⚡ Eléctrico</option>
          <option value="Híbrido">🔋 Híbrido</option>
        </select>
      </div>
      <div class="campo">
        <label>Transmisión</label>
        <select id="buscar_transmision">
          <option value="">Todas</option>
          <option value="Manual">⚙️ Manual</option>
          <option value="Automática">🔄 Automática</option>
        </select>
      </div>
      
      <div class="campo">
        <label>Kilometraje máximo</label>
        <input type="number" id="buscar_km_max" placeholder="Ej: 100000 — Dejalo vacío sin límite">
      </div>
      
      <div class="campo">
        <label>Precio máximo ($)</label>
        <input type="number" id="buscar_precio_max" placeholder="Ej: 1500000 — Dejalo vacío sin límite">
      </div>

      <button class="boton-buscar" onclick="realizarBusqueda()">🔍 Buscar Vehículos</button>
    </div>

    <div class="navegacion" id="caja_navegacion">
      <button id="btnAnterior" disabled>◀ Anterior</button>
      <span id="contador" class="contador">—</span>
      <button id="btnSiguiente" disabled>Siguiente ▶</button>
    </div>

    <div id="caja_resultado"></div>

    <a href="index.html" class="volver">← Volver a la página principal</a>
  </div>

  <script>
    const SUPABASE_URL = "https://cgwdahvstitjksphucqk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gQicOTNud-uR22ur4-TJQw_hAgmkBfr";

    const nombresFotos = [
      'Motor', 'Frente', 'Lateral izquierdo', 'Lateral derecho', 'Parte trasera',
      'Interior 1', 'Interior 2', 'Interior 3', 'Interior 4',
      'Ruedas', 'Detalle Extra 1', 'Detalle Extra 2'
    ];

    let sbClient = null;
    let idsFiltrados = [];
    let indiceActual = 0;
    let vehiculoActual = null;

    async function getSupabase() {
      if (!sbClient) {
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return sbClient;
    }

    async function realizarBusqueda() {
      const tipo = document.getElementById('buscar_tipo').value;
      const marca = document.getElementById('buscar_marca').value.trim();
      const modelo = document.getElementById('buscar_modelo').value.trim();
      const anio = document.getElementById('buscar_anio').value.trim();
      const ciudad = document.getElementById('buscar_ciudad').value;
      const combustible = document.getElementById('buscar_combustible').value;
      const transmision = document.getElementById('buscar_transmision').value;
      const kmMax = document.getElementById('buscar_km_max').value.trim();
      const precioMax = document.getElementById('buscar_precio_max').value.trim();

      const caja = document.getElementById('caja_resultado');
      const cajaNav = document.getElementById('caja_navegacion');
      const btnAnt = document.getElementById('btnAnterior');
      const btnSig = document.getElementById('btnSiguiente');
      
      caja.innerHTML = `<div class="cargando">🔄 Buscando vehículos...</div>`;
      idsFiltrados = [];
      indiceActual = 0;
      vehiculoActual = null;
      btnAnt.disabled = true;
      btnSig.disabled = true;
      cajaNav.classList.remove('activa');

      const sb = await getSupabase();
      let consulta = sb.from('autos').select('*');

      if (tipo) consulta = consulta.eq('tipo_vehiculo', tipo);
      if (marca) consulta = consulta.ilike('marca', `%${marca}%`);
      if (modelo) consulta = consulta.ilike('modelo', `%${modelo}%`);
      if (anio) {
        const numAnio = parseInt(anio);
        if (!isNaN(numAnio)) consulta = consulta.eq('anio', numAnio);
      }
      if (ciudad && ciudad !== 'Otra ciudad') consulta = consulta.ilike('ciudad', `%${ciudad}%`);
      if (combustible) consulta = consulta.eq('combustible', combustible);
      if (transmision) consulta = consulta.eq('transmision', transmision);

      consulta = consulta.order('id', { ascending: false });
      const { data, error } = await consulta;

      if (error) {
        caja.innerHTML = `<div class="sin-resultado">❌ Error: ${error.message}</div>`;
        return;
      }
      if (!data || data.length === 0) {
        caja.innerHTML = `<div class="sin-resultado">📭 No se encontraron vehículos con esos datos</div>`;
        return;
      }

      let resultados = data;
      
      if (kmMax) {
        const numKmMax = parseInt(kmMax);
        if (!isNaN(numKmMax)) {
          resultados = resultados.filter(auto => 
            auto.kilometraje === null || auto.kilometraje <= numKmMax
          );
        }
      }
      
      if (precioMax) {
        const numPrecioMax = parseFloat(precioMax);
        if (!isNaN(numPrecioMax)) {
          resultados = resultados.filter(auto => {
            if (!auto.precio) return true;
            const soloNumeros = auto.precio.replace(/[^0-9.,]/g, '').replace(',', '.');
            const valor = parseFloat(soloNumeros);
            return isNaN(valor) || valor <= numPrecioMax;
          });
        }
      }

      if (resultados.length === 0) {
        caja.innerHTML = `<div class="sin-resultado">📭 Ningún vehículo cumple con los filtros elegidos</div>`;
        return;
      }

      idsFiltrados = resultados.map(item => item.id);
      cajaNav.classList.add('activa');
      btnAnt.disabled = false;
      btnSig.disabled = false;
      await cargarUno(0);
    }

    async function cargarUno(posicion) {
      if (posicion < 0 || posicion >= idsFiltrados.length) return;

      const caja = document.getElementById('caja_resultado');
      caja.innerHTML = `<div class="cargando">🔄 Cargando vehículo ${posicion+1} de ${idsFiltrados.length}...</div>`;

      const sb = await getSupabase();
      const { data: vehiculo, error } = await sb
        .from('autos')
        .select('*')
        .eq('id', idsFiltrados[posicion])
        .single();

      if (error || !vehiculo) {
        caja.innerHTML = `<div class="sin-resultado">❌ Error al cargar el vehículo</div>`;
        return;
      }

      vehiculoActual = vehiculo;

      let fotosHtml = '';
      for (let i = 1; i <= 12; i++) {
        const foto = vehiculo[`foto${i}`];
        if (foto) {
          fotosHtml += `
            <div class="foto-caja">
              <div class="foto-ver"><img src="${foto}" alt="${nombresFotos[i-1]}"></div>
              <div class="foto-nombre">${nombresFotos[i-1]}</div>
            </div>
          `;
        }
      }
      const hayFotos = fotosHtml !== '';

      caja.innerHTML = `
      <div class="tarjeta">
        ${vehiculo.tipo_vehiculo ? `<span class="etiqueta-tipo">${vehiculo.tipo_vehiculo}</span>` : ''}
        
        <div class="titulo-vehiculo">${vehiculo.marca || ''} ${vehiculo.modelo || ''} — ${vehiculo.anio || ''}</div>
        <div class="fila"><strong>Versión:</strong> ${vehiculo.version || '-'}</div>
        <div class="fila"><strong>Ciudad:</strong> ${vehiculo.ciudad || '-'}</div>
        <div class="fila"><strong>Kilometraje:</strong> ${vehiculo.kilometraje ? vehiculo.kilometraje.toLocaleString('es-AR') + ' km' : 'No indicado'}</div>
        <div class="fila"><strong>Combustible:</strong> ${vehiculo.combustible || '-'}</div>
        <div class="fila"><strong>Transmisión:</strong> ${vehiculo.transmision || '-'}</div>
        <div class="fila"><strong>Precio:</strong> ${vehiculo.precio || '-'}</div>
        <div class="fila"><strong>Dueño:</strong> ${vehiculo.dueno || '-'}</div>
        <div class="fila"><strong>Dirección:</strong> ${vehiculo.direccion || '-'}</div>
        <div class="fila"><strong>Teléfono:</strong> ${vehiculo.telefono || '-'}</div>
        <div>
          ${vehiculo.permuta ? '<span class="etiqueta permuta">✅ Acepta permuta</span>' : ''}
          ${vehiculo.contado ? '<span class="etiqueta contado">💵 Solo contado</span>' : ''}
        </div>
        <div class="fila" style="margin-top: 10px;"><strong>Deuda:</strong> ${vehiculo.deuda || 'Sin deudas'}</div>
        <div class="fila"><strong>Descripción:</strong> ${vehiculo.descripcion || '-'}</div>
        
        ${hayFotos ? `
        <div class="fotos-titulo">📸 Fotos del vehículo</div>
        <div class="fotos-cuadricula">${fotosHtml}</div>
        ` : ''}

        <div class="zona-eliminar">
          <div class="titulo-eliminar">⚠️ Eliminar este vehículo</div>
          <input type="password" id="codigoSeguridad" class="input-eliminar" placeholder="Escribí tu código de seguridad">
          <button class="boton-eliminar" onclick="confirmarEliminar()">🗑️ Eliminar Definitivamente</button>
          <div id="mensajeEliminar" class="mensaje"></div>
        </div>
      </div>
      `;
      document.getElementById('contador').textContent = 
        `${posicion + 1} de ${idsFiltrados.length}`;
    }

    async function confirmarEliminar() {
      if (!vehiculoActual) return;

      const codigoIngresado = document.getElementById('codigoSeguridad').value.trim();
      const mensaje = document.getElementById('mensajeEliminar');
      
      mensaje.style.display = 'none';

      if (codigoIngresado !== vehiculoActual.codigo_seguridad) {
        mensaje.textContent = "❌ Código incorrecto. No se puede eliminar.";
        mensaje.className = "mensaje error";
        mensaje.style.display = 'block';
        return;
      }

      const sb = await getSupabase();
      const { error } = await sb
        .from('autos')
        .delete()
        .eq('id', vehiculoActual.id);

      if (error) {
        mensaje.textContent = "❌ Error: " + error.message;
        mensaje.className = "mensaje error";
        mensaje.style.display = 'block';
        return;
      }

      mensaje.textContent = "✅ Vehículo eliminado correctamente";
      mensaje.className = "mensaje exito";
      mensaje.style.display = 'block';

      setTimeout(() => {
        idsFiltrados = idsFiltrados.filter(id => id !== vehiculoActual.id);
        vehiculoActual = null;
        if (idsFiltrados.length > 0) {
          indiceActual = Math.min(indiceActual, idsFiltrados.length - 1);
          cargarUno(indiceActual);
        } else {
          document.getElementById('caja_resultado').innerHTML = 
            `<div class="sin-resultado">✅ Eliminado. No quedan más vehículos en esta búsqueda.</div>`;
          document.getElementById('caja_navegacion').classList.remove('activa');
        }
      }, 1800);
    }

    async function vehiculoAnterior() {
      if (idsFiltrados.length === 0) return;
      if (indiceActual === 0) {
        indiceActual = idsFiltrados.length - 1;
      } else {
        indiceActual--;
      }
      await cargarUno(indiceActual);
    }

    async function vehiculoSiguiente() {
      if (idsFiltrados.length === 0) return;
      if (indiceActual === idsFiltrados.length - 1) {
        indiceActual = 0;
      } else {
        indiceActual++;
      }
      await cargarUno(indiceActual);
    }

    document.getElementById('btnAnterior').addEventListener('click', vehiculoAnterior);
    document.getElementById('btnSiguiente').addEventListener('click', vehiculoSiguiente);

    // === CONTADOR DE VISITAS ===
    async function contarBuscar() {
      try {
        const { data } = await sbClient.from('visitas').select('cantidad').eq('pagina', 'buscar');
        if (data.length) {
          const nuevaCantidad = data[0].cantidad + 1;
          await sbClient.from('visitas').update({ cantidad: nuevaCantidad }).eq('pagina', 'buscar');
          console.log('✅ Buscar →', nuevaCantidad);
        }
      } catch (err) {
        console.log('⚠️ Error contador buscar:', err.message);
      }
    }
    // Esperamos a que esté conectado y contamos
    getSupabase().then(() => contarBuscar());
  </script>

</body>
</html>
